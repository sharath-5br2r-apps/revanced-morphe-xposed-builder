name: Cleanup

on:
  workflow_call:
  workflow_dispatch:
   inputs:
     cleanup_all_releases:
      type: boolean
      description: "Whether to Delete All Releases"
      required: true
      default: false
        
        

concurrency:
  group: clean
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete Older Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        if: ${{ inputs.cleanup_all_releases == false }}
        with:
          delete_releases: true
          delete_tags: true
          releases_keep_latest: 200
          delete_workflows: false
          releases_keep_keyword: stable/beta
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Delete All Releases and Older Workflows
        uses: ophub/delete-releases-workflows@main
        if: ${{ inputs.cleanup_all_releases == true }}
        with:
          delete_releases: true
          delete_tags: true
          delete_workflows: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Archive Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/cleanup-archive-assets.py

      - name: Cleanup Update Branch Changelogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/cleanup_update_branch.sh

      - name: Notify website catalog rebuild
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_TOKEN || secrets.WEBSITE_DISPATCH_TOKEN || secrets.WEBSITE_REPO_TOKEN || secrets.APKS_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          WEBSITE_REPO: "${{ vars.WEBSITE_REPO || 'sharath-5br2r-apps/sharath-5br2r-apps.github.io' }}"
        run: |
          curl -fsS -X POST "https://api.github.com/repos/${WEBSITE_REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -d '{"event_type": "catalog-updated"}' \
            || echo "::warning::Website catalog dispatch failed; the scheduled rebuild will converge."
