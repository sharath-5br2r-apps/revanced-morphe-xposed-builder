name: "CI / Update Versions"
run-name: "CI Run [Mode: ${{ inputs.mode || 'Scheduled/Default' }}]"
permissions: write-all
on:
  schedule:
    - cron: "0 0/2 * * *" # Every 2 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "Select CI execution mode"
        required: true
        type: choice
        default: "Default"
        options:
          - "Default"
          - "Update Versions Only"
          - "Generate Configs Only (No Build)"
          - "Build Only"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAWL_URL: "http://localhost:8191"
      CFB_URL: "http://localhost:8000"
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    outputs:
      trigger_stable: ${{ steps.effective_triggers.outputs.TRIGGER_STABLE }}
      trigger_prerelease: ${{ steps.effective_triggers.outputs.TRIGGER_PRERELEASE }}
      has_dev_1: ${{ steps.effective_triggers.outputs.HAS_DEV_1 }}
      has_dev_2: ${{ steps.effective_triggers.outputs.HAS_DEV_2 }}
      has_dev_3: ${{ steps.effective_triggers.outputs.HAS_DEV_3 }}
      has_dev_4: ${{ steps.effective_triggers.outputs.HAS_DEV_4 }}
      has_dev_5: ${{ steps.effective_triggers.outputs.HAS_DEV_5 }}
      has_stable_1: ${{ steps.effective_triggers.outputs.HAS_STABLE_1 }}
      has_stable_2: ${{ steps.effective_triggers.outputs.HAS_STABLE_2 }}
      has_stable_3: ${{ steps.effective_triggers.outputs.HAS_STABLE_3 }}
      has_stable_4: ${{ steps.effective_triggers.outputs.HAS_STABLE_4 }}
      has_stable_5: ${{ steps.effective_triggers.outputs.HAS_STABLE_5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure patch_sources.json exists
        id: ensure_patch_sources
        run: bash .github/scripts/ci_ensure_patch_sources.sh

      - name: Commit dummy patch_sources.json if created
        if: steps.ensure_patch_sources.outputs.created == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/patch_sources.json
          commit_message: "Create dummy patch_sources.json"

      - name: Fetch latest tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_tags
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci_fetch_tags.sh

      - name: Compare latest vs stored tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare
        env:
          LATEST_TAGS: ${{ steps.fetch_tags.outputs.latest }}
        run: bash .github/scripts/ci_compare_tags.sh

      - name: Fetch App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_app_versions
        run: bash .github/scripts/ci_fetch_app_versions.sh
        
      - name: Compare App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare_apps
        env:
          FETCHED_APP_VERSIONS: ${{ steps.fetch_app_versions.outputs.fetched }}
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Commit updated app versions and patch sources
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/app_versions.json configs/patch_sources.json
          commit_message: "Update app and patch versions [skip ci]"

      - name: Generate configs (JSON)
        if: ${{ inputs.mode != 'Update Versions Only' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1' || inputs.mode == 'Generate Configs Only (No Build)' || inputs.mode == 'Build Only') }}
        id: generate_configs
        env:
          TAGS_OLD: ${{ steps.compare.outputs.tags_old }}
          TAGS_NEW: ${{ steps.compare.outputs.tags_new }}
          TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE }}
          TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          DISABLE_CONFIG_UPDATE: "false"
          SKIP_VERSION_CHECK: ${{ inputs.mode == 'Build Only' && 'true' || 'false' }}
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Resolve effective triggers
        id: effective_triggers
        env:
          CREATED: ${{ steps.ensure_patch_sources.outputs.created }}
          MODE: ${{ inputs.mode || 'Default' }}
          RAW_TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE || '0' }}
          RAW_TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE || '0' }}
          RAW_TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_resolve_triggers.sh

      - name: Commit updated full config JSONs
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/config.*.updated.json
          commit_message: "Update generated configs [skip ci]"

      - name: Upload split config part artifacts
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        uses: actions/upload-artifact@v4
        with:
          name: split-configs
          path: |
            configs/config.stable.part*.json
            configs/config.dev.part*.json
          if-no-files-found: ignore

  build_dev_1:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_1 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part1.json"
      upload_release_metadata: false
    secrets: inherit

  build_dev_2:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_2 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part2.json"
      upload_release_metadata: false
    secrets: inherit

  build_dev_3:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_3 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part3.json"
      upload_release_metadata: false
    secrets: inherit

  build_dev_4:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_4 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part4.json"
      upload_release_metadata: false
    secrets: inherit

  build_dev_5:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_5 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part5.json"
      upload_release_metadata: false
    secrets: inherit

  build_stable_1:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_1 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part1.json"
      upload_release_metadata: false
    secrets: inherit

  build_stable_2:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_2 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part2.json"
      upload_release_metadata: false
    secrets: inherit

  build_stable_3:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_3 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part3.json"
      upload_release_metadata: false
    secrets: inherit

  build_stable_4:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_4 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part4.json"
      upload_release_metadata: false
    secrets: inherit

  build_stable_5:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_5 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part5.json"
      upload_release_metadata: false
    secrets: inherit

  aggregate_logs:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5]
    if: ${{ always() && needs.check_patch.result == 'success' && (needs.check_patch.outputs.trigger_prerelease == '1' || needs.check_patch.outputs.trigger_stable == '1') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: part-logs-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs for Dev
        if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' }}
        run: |
          mkdir -p dev_logs
          find logs_artifacts -path "*part-logs-beta*" -exec cp -r {}/. dev_logs/ \; 2>/dev/null || true
          cd dev_logs && bash ../.github/scripts/build_aggregate_logs.sh dev && cd ..

      - name: Aggregate logs for Stable
        if: ${{ needs.check_patch.outputs.trigger_stable == '1' }}
        run: |
          mkdir -p stable_logs
          find logs_artifacts -path "*part-logs-stable*" -exec cp -r {}/. stable_logs/ \; 2>/dev/null || true
          cd stable_logs && bash ../.github/scripts/build_aggregate_logs.sh stable && cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-build-logs
          path: |
            dev_logs/aggregated_out/*
            stable_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload aggregated metadata to release (update)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "dev_logs/aggregated_out" ]; then
            [ -f "dev_logs/aggregated_out/build.dev.json" ] && gh release upload update dev_logs/aggregated_out/build.dev.json --clobber || true
            [ -f "dev_logs/aggregated_out/build.dev.md" ] && gh release upload update dev_logs/aggregated_out/build.dev.md --clobber || true
          fi
          if [ -d "stable_logs/aggregated_out" ]; then
            [ -f "stable_logs/aggregated_out/build.stable.json" ] && gh release upload update stable_logs/aggregated_out/build.stable.json --clobber || true
            [ -f "stable_logs/aggregated_out/build.stable.md" ] && gh release upload update stable_logs/aggregated_out/build.stable.md --clobber || true
          fi

  trigger_cleanup:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, aggregate_logs]
    if: ${{ always() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, aggregate_logs, trigger_cleanup]
    if: ${{ always() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
