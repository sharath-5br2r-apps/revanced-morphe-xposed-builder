name: "CI / Update Versions"
run-name: "CI Run [Mode: ${{ inputs.mode || 'Scheduled/Default' }}]"
permissions: write-all
on:
  schedule:
    - cron: "35 1/2 * * *" # Every 2 hours
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: "Default"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select CI execution mode"
        required: true
        type: choice
        default: "Default"
        options:
          - "Default"
          - "Update Versions Only"
          - "Generate Configs Only (No Build)"
          - "Build Only"
          - "Batch Build (Stable)"
          - "Batch Build (Both)"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    outputs:
      trigger_stable: ${{ steps.effective_triggers.outputs.TRIGGER_STABLE }}
      trigger_prerelease: ${{ steps.effective_triggers.outputs.TRIGGER_PRERELEASE }}
      trigger_latest: ${{ steps.effective_triggers.outputs.TRIGGER_LATEST }}
      has_dev_1: ${{ steps.effective_triggers.outputs.HAS_DEV_1 }}
      has_dev_2: ${{ steps.effective_triggers.outputs.HAS_DEV_2 }}
      has_dev_3: ${{ steps.effective_triggers.outputs.HAS_DEV_3 }}
      has_dev_4: ${{ steps.effective_triggers.outputs.HAS_DEV_4 }}
      has_dev_5: ${{ steps.effective_triggers.outputs.HAS_DEV_5 }}
      has_stable_1: ${{ steps.effective_triggers.outputs.HAS_STABLE_1 }}
      has_stable_2: ${{ steps.effective_triggers.outputs.HAS_STABLE_2 }}
      has_stable_3: ${{ steps.effective_triggers.outputs.HAS_STABLE_3 }}
      has_stable_4: ${{ steps.effective_triggers.outputs.HAS_STABLE_4 }}
      has_stable_5: ${{ steps.effective_triggers.outputs.HAS_STABLE_5 }}
      has_latest_1: ${{ steps.effective_triggers.outputs.HAS_LATEST_1 }}
      has_latest_2: ${{ steps.effective_triggers.outputs.HAS_LATEST_2 }}
      has_latest_3: ${{ steps.effective_triggers.outputs.HAS_LATEST_3 }}
      has_latest_4: ${{ steps.effective_triggers.outputs.HAS_LATEST_4 }}
      has_latest_5: ${{ steps.effective_triggers.outputs.HAS_LATEST_5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Sync patch sources and fetch tags
        if: ${{ inputs.mode != 'Build Only' }}
        id: compare
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_patch_sources.py

      - name: Fetch App Versions
        if: ${{ inputs.mode != 'Build Only' }}
        id: fetch_app_versions
        env:
          CFB_URL: "http://localhost:8000"
        run: bash .github/scripts/ci_fetch_app_versions.sh
        
      - name: Compare App Versions
        if: ${{ inputs.mode != 'Build Only' }}
        id: compare_apps
        env:
          FETCHED_APP_VERSIONS: ${{ steps.fetch_app_versions.outputs.fetched }}
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Check App Patches (Bytecode Diff)
        if: ${{ inputs.mode != 'Build Only' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BETA == '1') }}
        id: check_app_patches
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_check_app_patches.py

      - name: Generate configs (JSON)
        if: ${{ inputs.mode != 'Build Only' && (inputs.mode == 'Update Versions Only' || inputs.mode == 'Default' || inputs.mode == 'Generate Configs Only (No Build)' || inputs.mode == 'Batch Build (Stable)' || inputs.mode == 'Batch Build (Both)' || steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        id: generate_configs
        env:
          TAGS_OLD: ${{ steps.compare.outputs.tags_old }}
          TAGS_NEW: ${{ steps.compare.outputs.tags_new }}
          TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE }}
          TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          FORCE_BATCH_CONFIGS: ${{ startsWith(inputs.mode, 'Batch Build') && 'true' || 'false' }}
          DISABLE_CONFIG_UPDATE: "false"
          SKIP_VERSION_CHECK: ${{ inputs.mode == 'Build Only' && 'true' || 'false' }}
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Resolve effective triggers
        id: effective_triggers
        env:
          MODE: ${{ inputs.mode || 'Default' }}
          RAW_TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE || '0' }}
          RAW_TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE || '0' }}
          RAW_TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_resolve_triggers.sh

      - name: Commit updated version metadata and configs
        if: ${{ inputs.mode == 'Update Versions Only' || inputs.mode == 'Generate Configs Only (No Build)' || inputs.mode == 'Default' || inputs.mode == 'Batch Build (Stable)' || inputs.mode == 'Batch Build (Both)' || steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/app_versions.json configs/patch_sources.json configs/patch_file_hashes.json configs/*/config.updated.json configs/*/config.part*.json
          commit_message: "Update patch sources, app versions and generated configs [skip ci]"

      - name: Upload split config part artifacts
        if: ${{ inputs.mode != 'Batch Build (Stable)' && inputs.mode != 'Batch Build (Both)' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        uses: actions/upload-artifact@v7
        with:
          name: split-configs
          path: |
            configs/stable/config.part*.json
            configs/beta/config.part*.json
            configs/both/config.part*.json
            configs/batch/config.part*.json
          if-no-files-found: ignore

  resolve_dev_version:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code_dev: ${{ steps.version_dev.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code (Dev)
        id: version_dev
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_dev_1:
    needs: [check_patch, resolve_dev_version]
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_1 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/beta/config.part1.json"
      release_version_code: ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}
      upload_release_metadata: false
      aggregate_flavor: "dev"
    secrets: inherit

  build_dev_2:
    needs: [check_patch, resolve_dev_version]
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_2 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/beta/config.part2.json"
      release_version_code: ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}
      upload_release_metadata: false
      aggregate_flavor: "dev"
    secrets: inherit

  build_dev_3:
    needs: [check_patch, resolve_dev_version]
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_3 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/beta/config.part3.json"
      release_version_code: ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}
      upload_release_metadata: false
      aggregate_flavor: "dev"
    secrets: inherit

  build_dev_4:
    needs: [check_patch, resolve_dev_version]
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_4 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/beta/config.part4.json"
      release_version_code: ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}
      upload_release_metadata: false
      aggregate_flavor: "dev"
    secrets: inherit

  build_dev_5:
    needs: [check_patch, resolve_dev_version]
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.outputs.has_dev_5 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/beta/config.part5.json"
      release_version_code: ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}
      upload_release_metadata: false
      aggregate_flavor: "dev"
    secrets: inherit

  aggregate_dev_logs:
    needs: [check_patch, resolve_dev_version, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_prerelease == '1' && (needs.build_dev_1.result == 'success' || needs.build_dev_2.result == 'success' || needs.build_dev_3.result == 'success' || needs.build_dev_4.result == 'success' || needs.build_dev_5.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dev part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-dev-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs for Dev
        run: |
          mkdir -p dev_logs
          cp -r logs_artifacts/* dev_logs/ 2>/dev/null || true
          cd dev_logs && bash ../.github/scripts/build_aggregate_logs.sh dev && cd ..

      - name: Upload aggregated dev logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-dev-build-logs
          path: dev_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload dev build.json to numbered release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}"
          # Discover aggregated json and markdown directly
          json_file="build.json"
          md_file="release_notes.md"
          if [ -d "dev_logs/aggregated_out" ]; then
            for j in dev_logs/aggregated_out/build.*.json; do
              [ -s "$j" ] && { json_file="$j"; cp -f "$j" build.json; break; }
            done
            for m in dev_logs/aggregated_out/build.*.md; do
              [ -s "$m" ] && { md_file="$m"; cp -f "$m" release_notes.md; break; }
            done
          fi

          if [ ! -s "$md_file" ] && [ -s "$json_file" ]; then
            python3 .github/scripts/generate_release_notes.py "$json_file" release_notes.md || true
            md_file="release_notes.md"
          fi

          # Convert the aggregated raw build.json into the release manifest
          # before uploading. The raw file supplies the exact output filenames.
          if [ -s "$json_file" ]; then
            NEXT_VER_CODE="$tag" IS_PRERELEASE="true" MANIFEST_ONLY=true \
              python3 .github/scripts/build_make_manifest.py
          fi
          release_json_file="temp/manifest/build.json"

          if [ ! -s "$release_json_file" ]; then
            echo "::error::Dev release manifest was not generated"
            exit 1
          fi

          mkdir -p dev_logs/release-manifest
          cp -f "$release_json_file" dev_logs/release-manifest/build.json

          if [ -n "$tag" ] && [ -s "$release_json_file" ]; then
            if [[ "$tag" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2})-([0-9]+)$ ]]; then
              title_base="Build ${BASH_REMATCH[1]} (revision ${BASH_REMATCH[2]})"
            else
              title_base="Build $tag"
            fi
            release_title="${title_base} (Pre-release)"
            notes_arg=("--notes" "")
            [ -s "$md_file" ] && notes_arg=("--notes-file" "$md_file")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -s "$md_file" ] && gh release edit "$tag" --notes-file "$md_file" || true
            else
              gh release create "$tag" --title "$release_title" --prerelease "${notes_arg[@]}" || true
            fi
            if [ -s "$release_json_file" ]; then
              echo "Uploading $release_json_file to release $tag..."
              gh release upload "$tag" "$release_json_file#build.json" --clobber || {
                echo "::warning::Failed to upload $release_json_file to release $tag, retrying..."
                sleep 3
                gh release upload "$tag" "$release_json_file#build.json" --clobber || echo "::warning::Failed to upload $release_json_file to release $tag"
              }
            fi
          fi

      - name: Upload dev release manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-release-manifest
          path: dev_logs/release-manifest/build.json
          if-no-files-found: error

      - name: Collect update branch files (Dev)
        run: |
          set -euo pipefail
          mkdir -p changelogs
          tag="${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}"
          json_file="dev_logs/aggregated_out/build.dev.json"
          changelog_file="dev_logs/aggregated_out/build.dev.md"
          if [ -n "$tag" ] && [ -s "$json_file" ]; then
            if [ ! -s "$changelog_file" ]; then
              python3 .github/scripts/generate_release_notes.py "$json_file" "$changelog_file"
            fi
            cp -f "$json_file" "build.json"
            [ -s "$changelog_file" ] && cp -f "$changelog_file" "changelogs/${tag}.md"
          fi

      - name: Commit update branch files (Dev)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: update
          create_branch: true
          skip_checkout: true
          add_options: -f
          push_options: --force
          file_pattern: build.json changelogs/*.md
          commit_message: "Bump version ${{ needs.resolve_dev_version.outputs.next_ver_code_dev }}"

  resolve_stable_version:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, aggregate_dev_logs]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code_stable: ${{ steps.version_stable.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code (Stable)
        id: version_stable
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_stable_1:
    needs: [check_patch, resolve_stable_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_1 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/stable/config.part1.json"
      release_version_code: ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}
      upload_release_metadata: false
      aggregate_flavor: "stable"
    secrets: inherit

  build_stable_2:
    needs: [check_patch, resolve_stable_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_2 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/stable/config.part2.json"
      release_version_code: ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}
      upload_release_metadata: false
      aggregate_flavor: "stable"
    secrets: inherit

  build_stable_3:
    needs: [check_patch, resolve_stable_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_3 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/stable/config.part3.json"
      release_version_code: ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}
      upload_release_metadata: false
      aggregate_flavor: "stable"
    secrets: inherit

  build_stable_4:
    needs: [check_patch, resolve_stable_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_4 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/stable/config.part4.json"
      release_version_code: ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}
      upload_release_metadata: false
      aggregate_flavor: "stable"
    secrets: inherit

  build_stable_5:
    needs: [check_patch, resolve_stable_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.outputs.has_stable_5 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/stable/config.part5.json"
      release_version_code: ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}
      upload_release_metadata: false
      aggregate_flavor: "stable"
    secrets: inherit

  aggregate_stable_logs:
    needs: [check_patch, resolve_stable_version, build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_stable == '1' && (needs.build_stable_1.result == 'success' || needs.build_stable_2.result == 'success' || needs.build_stable_3.result == 'success' || needs.build_stable_4.result == 'success' || needs.build_stable_5.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download stable part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-stable-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs for Stable
        run: |
          mkdir -p stable_logs
          cp -r logs_artifacts/* stable_logs/ 2>/dev/null || true
          cd stable_logs && bash ../.github/scripts/build_aggregate_logs.sh stable && cd ..

      - name: Upload aggregated stable logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-stable-build-logs
          path: stable_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload stable build.json to numbered release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}"
          # Discover aggregated json and markdown directly
          json_file="build.json"
          md_file="release_notes.md"
          if [ -d "stable_logs/aggregated_out" ]; then
            for j in stable_logs/aggregated_out/build.*.json; do
              [ -s "$j" ] && { json_file="$j"; cp -f "$j" build.json; break; }
            done
            for m in stable_logs/aggregated_out/build.*.md; do
              [ -s "$m" ] && { md_file="$m"; cp -f "$m" release_notes.md; break; }
            done
          fi

          if [ ! -s "$md_file" ] && [ -s "$json_file" ]; then
            python3 .github/scripts/generate_release_notes.py "$json_file" release_notes.md || true
            md_file="release_notes.md"
          fi

          # Convert the aggregated raw build.json into the release manifest
          # before uploading. The raw file supplies the exact output filenames.
          if [ -s "$json_file" ]; then
            NEXT_VER_CODE="$tag" IS_PRERELEASE="false" MANIFEST_ONLY=true \
              python3 .github/scripts/build_make_manifest.py
          fi
          release_json_file="temp/manifest/build.json"

          if [ ! -s "$release_json_file" ]; then
            echo "::error::Stable release manifest was not generated"
            exit 1
          fi

          mkdir -p stable_logs/release-manifest
          cp -f "$release_json_file" stable_logs/release-manifest/build.json

          if [ -n "$tag" ] && [ -s "$release_json_file" ]; then
            if [[ "$tag" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2})-([0-9]+)$ ]]; then
              title_base="Build ${BASH_REMATCH[1]} (revision ${BASH_REMATCH[2]})"
            else
              title_base="Build $tag"
            fi
            notes_arg=("--notes" "")
            [ -s "$md_file" ] && notes_arg=("--notes-file" "$md_file")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -s "$md_file" ] && gh release edit "$tag" --notes-file "$md_file" || true
            else
              gh release create "$tag" --title "$title_base" "${notes_arg[@]}" || true
            fi
            if [ -s "$release_json_file" ]; then
              echo "Uploading $release_json_file to release $tag..."
              gh release upload "$tag" "$release_json_file#build.json" --clobber || {
                echo "::warning::Failed to upload $release_json_file to release $tag, retrying..."
                sleep 3
                gh release upload "$tag" "$release_json_file#build.json" --clobber || echo "::warning::Failed to upload $release_json_file to release $tag"
              }
            fi
          fi

      - name: Upload stable release manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: stable-release-manifest
          path: stable_logs/release-manifest/build.json
          if-no-files-found: error


      - name: Collect update branch files (Stable)
        run: |
          set -euo pipefail
          mkdir -p changelogs
          tag="${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}"
          json_file="stable_logs/aggregated_out/build.stable.json"
          changelog_file="stable_logs/aggregated_out/build.stable.md"
          if [ -n "$tag" ] && [ -s "$json_file" ]; then
            if [ ! -s "$changelog_file" ]; then
              python3 .github/scripts/generate_release_notes.py "$json_file" "$changelog_file"
            fi
            cp -f "$json_file" "build.json"
            [ -s "$changelog_file" ] && cp -f "$changelog_file" "changelogs/${tag}.md"
          fi

      - name: Commit update branch files (Stable)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: update
          create_branch: true
          skip_checkout: true
          add_options: -f
          push_options: --force
          file_pattern: build.json changelogs/*.md
          commit_message: "Bump version ${{ needs.resolve_stable_version.outputs.next_ver_code_stable }}"

  resolve_latest_version:
    needs: [check_patch, build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, aggregate_stable_logs]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code_latest: ${{ steps.version_latest.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code (Latest)
        id: version_latest
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_latest_1:
    needs: [check_patch, resolve_latest_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && needs.check_patch.outputs.has_latest_1 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/both/config.part1.json"
      patches_version: "both"
      release_version_code: ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}
      upload_release_metadata: false
      aggregate_flavor: "latest"
    secrets: inherit

  build_latest_2:
    needs: [check_patch, resolve_latest_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && needs.check_patch.outputs.has_latest_2 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/both/config.part2.json"
      patches_version: "both"
      release_version_code: ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}
      upload_release_metadata: false
      aggregate_flavor: "latest"
    secrets: inherit

  build_latest_3:
    needs: [check_patch, resolve_latest_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && needs.check_patch.outputs.has_latest_3 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/both/config.part3.json"
      patches_version: "both"
      release_version_code: ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}
      upload_release_metadata: false
      aggregate_flavor: "latest"
    secrets: inherit

  build_latest_4:
    needs: [check_patch, resolve_latest_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && needs.check_patch.outputs.has_latest_4 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/both/config.part4.json"
      patches_version: "both"
      release_version_code: ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}
      upload_release_metadata: false
      aggregate_flavor: "latest"
    secrets: inherit

  build_latest_5:
    needs: [check_patch, resolve_latest_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && needs.check_patch.outputs.has_latest_5 == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/both/config.part5.json"
      patches_version: "both"
      release_version_code: ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}
      upload_release_metadata: false
      aggregate_flavor: "latest"
    secrets: inherit

  aggregate_latest_logs:
    needs: [check_patch, resolve_latest_version, build_latest_1, build_latest_2, build_latest_3, build_latest_4, build_latest_5]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.check_patch.outputs.trigger_latest == '1' && (needs.build_latest_1.result == 'success' || needs.build_latest_2.result == 'success' || needs.build_latest_3.result == 'success' || needs.build_latest_4.result == 'success' || needs.build_latest_5.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download latest part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-latest-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs for Absolute Latest
        run: |
          mkdir -p latest_logs
          cp -r logs_artifacts/* latest_logs/ 2>/dev/null || true
          cd latest_logs && bash ../.github/scripts/build_aggregate_logs.sh latest && cd ..

      - name: Upload aggregated latest logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-latest-build-logs
          path: latest_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload latest build.json to numbered release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}"
          # Discover aggregated json and markdown directly
          json_file="build.json"
          md_file="release_notes.md"
          if [ -d "latest_logs/aggregated_out" ]; then
            for j in latest_logs/aggregated_out/build.*.json; do
              [ -s "$j" ] && { json_file="$j"; cp -f "$j" build.json; break; }
            done
            for m in latest_logs/aggregated_out/build.*.md; do
              [ -s "$m" ] && { md_file="$m"; cp -f "$m" release_notes.md; break; }
            done
          fi

          if [ ! -s "$md_file" ] && [ -s "$json_file" ]; then
            python3 .github/scripts/generate_release_notes.py "$json_file" release_notes.md || true
            md_file="release_notes.md"
          fi

          # Convert the aggregated raw build.json into the release manifest
          # before uploading. The raw file supplies the exact output filenames.
          if [ -s "$json_file" ]; then
            NEXT_VER_CODE="$tag" IS_PRERELEASE="false" MANIFEST_ONLY=true \
              python3 .github/scripts/build_make_manifest.py
          fi
          release_json_file="temp/manifest/build.json"

          if [ ! -s "$release_json_file" ]; then
            echo "::error::Latest release manifest was not generated"
            exit 1
          fi

          mkdir -p latest_logs/release-manifest
          cp -f "$release_json_file" latest_logs/release-manifest/build.json

          if [ -n "$tag" ] && [ -s "$release_json_file" ]; then
            if [[ "$tag" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2})-([0-9]+)$ ]]; then
              title_base="Build ${BASH_REMATCH[1]} (revision ${BASH_REMATCH[2]})"
            else
              title_base="Build $tag"
            fi
            notes_arg=("--notes" "")
            [ -s "$md_file" ] && notes_arg=("--notes-file" "$md_file")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -s "$md_file" ] && gh release edit "$tag" --notes-file "$md_file" || true
            else
              gh release create "$tag" --title "$title_base" "${notes_arg[@]}" || true
            fi
            if [ -s "$release_json_file" ]; then
              echo "Uploading $release_json_file to release $tag..."
              gh release upload "$tag" "$release_json_file#build.json" --clobber || {
                echo "::warning::Failed to upload $release_json_file to release $tag, retrying..."
                sleep 3
                gh release upload "$tag" "$release_json_file#build.json" --clobber || echo "::warning::Failed to upload $release_json_file to release $tag"
              }
            fi
          fi

      - name: Upload latest release manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: latest-release-manifest
          path: latest_logs/release-manifest/build.json
          if-no-files-found: error
          
      - name: Collect update branch files (Latest)
        run: |
          set -euo pipefail
          mkdir -p changelogs
          tag="${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}"
          json_file="latest_logs/aggregated_out/build.latest.json"
          changelog_file="latest_logs/aggregated_out/build.latest.md"
          if [ -n "$tag" ] && [ -s "$json_file" ]; then
            if [ ! -s "$changelog_file" ]; then
              python3 .github/scripts/generate_release_notes.py "$json_file" "$changelog_file"
            fi
            cp -f "$json_file" "build.json"
            [ -s "$changelog_file" ] && cp -f "$changelog_file" "changelogs/${tag}.md"
          fi

      - name: Commit update branch files (Latest)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: update
          create_branch: true
          skip_checkout: true
          add_options: -f
          push_options: --force
          file_pattern: build.json changelogs/*.md
          commit_message: "Bump version ${{ needs.resolve_latest_version.outputs.next_ver_code_latest }}"

  resolve_batch_version:
    needs: check_patch
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && (inputs.mode == 'Batch Build (Stable)' || inputs.mode == 'Batch Build (Both)') }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code_batch: ${{ steps.version_batch.outputs.NEXT_VER_CODE }}
      patches_version: ${{ inputs.mode == 'Batch Build (Both)' && 'both' || 'stable' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code (Batch)
        id: version_batch
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_batch:
    needs: [check_patch, resolve_batch_version]
    if: ${{ !cancelled() && needs.check_patch.result == 'success' && needs.resolve_batch_version.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        config_file: ["configs/batch/config.part1.json", "configs/batch/config.part2.json", "configs/batch/config.part3.json", "configs/batch/config.part4.json", "configs/batch/config.part5.json", "configs/batch/config.part6.json", "configs/batch/config.part7.json", "configs/batch/config.part8.json", "configs/batch/config.part9.json", "configs/batch/config.part10.json", "configs/batch/config.part11.json", "configs/batch/config.part12.json", "configs/batch/config.part13.json", "configs/batch/config.part14.json", "configs/batch/config.part15.json", "configs/batch/config.part16.json"]
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ matrix.config_file }}
      patches_version: ${{ needs.resolve_batch_version.outputs.patches_version }}
      release_version_code: ${{ needs.resolve_batch_version.outputs.next_ver_code_batch }}
      upload_release_metadata: false
      aggregate_flavor: "batch"
    secrets: inherit

  aggregate_batch_logs:
    needs: [check_patch, resolve_batch_version, build_batch]
    if: ${{ !cancelled() && needs.build_batch.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-batch-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs
        run: |
          mkdir -p batch_logs
          cp -r logs_artifacts/* batch_logs/ 2>/dev/null || true
          cd batch_logs
          FLAVOR="batch"
          bash ../.github/scripts/build_aggregate_logs.sh "$FLAVOR"
          cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-build-logs
          path: batch_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload build.json to numbered release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve_batch_version.outputs.next_ver_code_batch }}"
          # Discover aggregated json and markdown directly
          json_file="build.json"
          md_file="release_notes.md"
          if [ -d "batch_logs/aggregated_out" ]; then
            for j in batch_logs/aggregated_out/build.*.json; do
              [ -s "$j" ] && { json_file="$j"; cp -f "$j" build.json; break; }
            done
            for m in batch_logs/aggregated_out/build.*.md; do
              [ -s "$m" ] && { md_file="$m"; cp -f "$m" release_notes.md; break; }
            done
          fi

          if [ ! -s "$md_file" ] && [ -s "$json_file" ]; then
            python3 .github/scripts/generate_release_notes.py "$json_file" release_notes.md || true
            md_file="release_notes.md"
          fi

          # Convert the aggregated raw build.json into the release manifest
          # before uploading. The raw file supplies the exact output filenames.
          if [ -s "$json_file" ]; then
            NEXT_VER_CODE="$tag" IS_PRERELEASE="${{ inputs.mode == 'Batch Build (Both)' && 'true' || 'false' }}" MANIFEST_ONLY=true \
              python3 .github/scripts/build_make_manifest.py
          fi
          release_json_file="temp/manifest/build.json"

          if [ ! -s "$release_json_file" ]; then
            echo "::error::Batch release manifest was not generated"
            exit 1
          fi

          mkdir -p batch_logs/release-manifest
          cp -f "$release_json_file" batch_logs/release-manifest/build.json

          if [ -n "$tag" ] && [ -s "$release_json_file" ]; then
            if [[ "$tag" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2})-([0-9]+)$ ]]; then
              title_base="Build ${BASH_REMATCH[1]} (revision ${BASH_REMATCH[2]})"
            else
              title_base="Build $tag"
            fi
            notes_arg=("--notes" "")
            [ -s "$md_file" ] && notes_arg=("--notes-file" "$md_file")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -s "$md_file" ] && gh release edit "$tag" --notes-file "$md_file" || true
            else
              gh release create "$tag" --title "$title_base" "${notes_arg[@]}" || true
            fi
            if [ -s "$release_json_file" ]; then
              echo "Uploading $release_json_file to release $tag..."
              gh release upload "$tag" "$release_json_file#build.json" --clobber || {
                echo "::warning::Failed to upload $release_json_file to release $tag, retrying..."
                sleep 3
                gh release upload "$tag" "$release_json_file#build.json" --clobber || echo "::warning::Failed to upload $release_json_file to release $tag"
              }
            fi
          fi

      - name: Upload batch release manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: batch-release-manifest
          path: batch_logs/release-manifest/build.json
          if-no-files-found: error

      - name: Collect update branch files (Batch)
        run: |
          set -euo pipefail
          mkdir -p changelogs
          tag="${{ needs.resolve_batch_version.outputs.next_ver_code_batch }}"
          json_file="batch_logs/aggregated_out/build.batch.json"
          changelog_file="batch_logs/aggregated_out/build.batch.md"
          if [ -n "$tag" ] && [ -s "$json_file" ]; then
            if [ ! -s "$changelog_file" ]; then
              python3 .github/scripts/generate_release_notes.py "$json_file" "$changelog_file"
            fi
            cp -f "$json_file" "build.json"
            [ -s "$changelog_file" ] && cp -f "$changelog_file" "changelogs/${tag}.md"
          fi

      - name: Commit update branch files (Batch)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: update
          create_branch: true
          skip_checkout: true
          add_options: -f
          # The update branch is generated metadata, not a development branch.
          # Replace its previous generated snapshot so stale concurrent runs do
          # not fail with a non-fast-forward push.
          push_options: --force
          file_pattern: build.json changelogs/*.md
          commit_message: "Bump version ${{ needs.resolve_batch_version.outputs.next_ver_code_batch }}"

  trigger_cleanup:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, build_latest_1, build_latest_2, build_latest_3, build_latest_4, build_latest_5, aggregate_dev_logs, aggregate_stable_logs, aggregate_latest_logs, build_batch, aggregate_batch_logs]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, build_latest_1, build_latest_2, build_latest_3, build_latest_4, build_latest_5, aggregate_dev_logs, aggregate_stable_logs, aggregate_latest_logs, build_batch, aggregate_batch_logs, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
