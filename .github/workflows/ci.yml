name: CI

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        type: choice
        default: "Default"
        options:
          - "Default"
          - "Batch Build (Absolute Latest)"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 60
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
    outputs:
      trigger_stable: ${{ steps.effective_triggers.outputs.TRIGGER_STABLE }}
      trigger_beta: ${{ steps.effective_triggers.outputs.TRIGGER_BETA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Compile Base Configs (JSON)
        run: bash .github/scripts/ci_compile_base_configs.sh

      - name: Sync Patch Sources
        id: sync_patch_sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/sync_patch_sources.py

      - name: Setup Python dependencies
        run: pip install --no-cache-dir curl_cffi || true

      - name: Fetch App Versions
        id: fetch_app_versions
        env:
          CF_BYPASS_SOLVER_TRAWL_8191_ENABLED: "true"
        run: bash .github/scripts/ci_fetch_app_versions.sh
        
      - name: Compare App Versions
        id: compare_apps
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Check Patch App Updates
        if: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE == '1' || steps.sync_patch_sources.outputs.TRIGGER_BETA == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_check_app_patches.py

      - name: Generate configs (JSON)
        if: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE == '1' || steps.sync_patch_sources.outputs.TRIGGER_BETA == '1' || steps.sync_patch_sources.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1' }}
        id: generate_configs
        env:
          TRIGGER_STABLE: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE }}
          TRIGGER_BETA: ${{ steps.sync_patch_sources.outputs.TRIGGER_BETA }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          TRIGGER_BLOCKED: ${{ steps.sync_patch_sources.outputs.TRIGGER_BLOCKED }}
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Resolve effective triggers
        id: effective_triggers
        env:
          MODE: ${{ inputs.mode || 'Default' }}
          RAW_TRIGGER_STABLE: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE || '0' }}
          RAW_TRIGGER_BETA: ${{ steps.sync_patch_sources.outputs.TRIGGER_BETA || '0' }}
          RAW_TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_resolve_triggers.sh

      - name: Notify telegram
        if: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE == '1' || steps.sync_patch_sources.outputs.TRIGGER_BETA == '1' || steps.sync_patch_sources.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TRIGGER_STABLE: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE }}
          TRIGGER_BETA: ${{ steps.sync_patch_sources.outputs.TRIGGER_BETA }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          EFFECTIVE_STABLE: ${{ steps.effective_triggers.outputs.TRIGGER_STABLE }}
          EFFECTIVE_BETA: ${{ steps.effective_triggers.outputs.TRIGGER_BETA }}
        run: bash .github/scripts/ci_notify_telegram.sh

      - name: Commit updated patch sources and configs
        if: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE == '1' || steps.sync_patch_sources.outputs.TRIGGER_BETA == '1' || steps.sync_patch_sources.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: .github/configs/*.json
          commit_message: "Update patch sources, app versions and generated configs [skip ci]"

  build_beta:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_beta == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.beta.updated.json"
    secrets: inherit

  build_stable:
    needs: [check_patch, build_beta]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && needs.build_beta.result != 'cancelled' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.stable.updated.json"
    secrets: inherit

  build_batch_part1:
    needs: check_patch
    if: ${{ inputs.mode == 'Batch Build (Absolute Latest)' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.absolutelatest.part1.json"
    secrets: inherit

  build_batch_part2:
    needs: [check_patch, build_batch_part1]
    if: ${{ always() && inputs.mode == 'Batch Build (Absolute Latest)' && !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.absolutelatest.part2.json"
    secrets: inherit

  build_batch_part3:
    needs: [check_patch, build_batch_part2]
    if: ${{ always() && inputs.mode == 'Batch Build (Absolute Latest)' && !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.absolutelatest.part3.json"
    secrets: inherit

  build_batch_part4:
    needs: [check_patch, build_batch_part3]
    if: ${{ always() && inputs.mode == 'Batch Build (Absolute Latest)' && !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.absolutelatest.part4.json"
    secrets: inherit

  build_batch_part5:
    needs: [check_patch, build_batch_part4]
    if: ${{ always() && inputs.mode == 'Batch Build (Absolute Latest)' && !cancelled() }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: ".github/configs/config.absolutelatest.part5.json"
    secrets: inherit

  trigger_cleanup:
    needs: [build_beta, build_stable, build_batch_part1, build_batch_part2, build_batch_part3, build_batch_part4, build_batch_part5]
    if: ${{ always() && (needs.build_beta.result == 'success' || needs.build_stable.result == 'success' || needs.build_batch_part1.result == 'success' || needs.build_batch_part2.result == 'success' || needs.build_batch_part3.result == 'success' || needs.build_batch_part4.result == 'success' || needs.build_batch_part5.result == 'success') }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_beta, build_stable, build_batch_part1, build_batch_part2, build_batch_part3, build_batch_part4, build_batch_part5, trigger_cleanup]
    if: ${{ always() && (needs.build_beta.result == 'success' || needs.build_stable.result == 'success' || needs.build_batch_part1.result == 'success' || needs.build_batch_part2.result == 'success' || needs.build_batch_part3.result == 'success' || needs.build_batch_part4.result == 'success' || needs.build_batch_part5.result == 'success') }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [check_patch, build_beta, build_stable, build_batch_part1, build_batch_part2, build_batch_part3, build_batch_part4, build_batch_part5]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "CI"
    secrets: inherit
