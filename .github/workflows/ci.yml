name: "CI / Update Versions"
permissions: write-all
on:
  schedule:
    - cron: "0 0/2 * * *" # Every 2 hours
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip building APKs/modules and only update versions/configs"
        required: false
        type: boolean
        default: false
      disable_config_update:
        description: "Disable generating/updating config JSONs (configs/config.*.updated.json)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAWL_URL: "http://localhost:8191"
      CFB_URL: "http://localhost:8000"
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    outputs:
      trigger_stable: ${{ steps.effective_triggers.outputs.TRIGGER_STABLE }}
      trigger_prerelease: ${{ steps.effective_triggers.outputs.TRIGGER_PRERELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure patch_sources.json exists
        id: ensure_patch_sources
        run: bash .github/scripts/ci_ensure_patch_sources.sh

      - name: Commit dummy patch_sources.json if created
        if: steps.ensure_patch_sources.outputs.created == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/patch_sources.json
          commit_message: "Create dummy patch_sources.json"

      - name: Fetch latest tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_tags
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci_fetch_tags.sh

      - name: Compare latest vs stored tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare
        env:
          LATEST_TAGS: ${{ steps.fetch_tags.outputs.latest }}
        run: bash .github/scripts/ci_compare_tags.sh

      - name: Fetch App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_app_versions
        run: bash .github/scripts/ci_fetch_app_versions.sh
        
      - name: Compare App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare_apps
        env:
          FETCHED_APP_VERSIONS: ${{ steps.fetch_app_versions.outputs.fetched }}
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Commit updated app versions and patch sources
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/app_versions.json configs/patch_sources.json
          commit_message: "Update app and patch versions [skip ci]"

      - name: Generate configs (JSON)
        if: ${{ inputs.disable_config_update != true && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        id: generate_configs
        env:
          TAGS_OLD: ${{ steps.compare.outputs.tags_old }}
          TAGS_NEW: ${{ steps.compare.outputs.tags_new }}
          TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE }}
          TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          DISABLE_CONFIG_UPDATE: ${{ inputs.disable_config_update || 'false' }}
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Resolve effective triggers
        id: effective_triggers
        env:
          CREATED: ${{ steps.ensure_patch_sources.outputs.created }}
          SKIP_BUILD: ${{ inputs.skip_build || 'false' }}
          RAW_TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE || '0' }}
          RAW_TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE || '0' }}
          RAW_TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_resolve_triggers.sh

      - name: Commit updated full config JSONs
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/config.*.updated.json
          commit_message: "Update generated configs [skip ci]"

      - name: Upload split config part artifacts
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        uses: actions/upload-artifact@v4
        with:
          name: split-configs
          path: |
            configs/config.stable.part*.json
            configs/config.dev.part*.json
          if-no-files-found: ignore

  build_dev_1:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.dev.part1.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part1.json"
    secrets: inherit

  build_dev_2:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.dev.part2.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part2.json"
    secrets: inherit

  build_dev_3:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.dev.part3.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part3.json"
    secrets: inherit

  build_dev_4:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.dev.part4.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part4.json"
    secrets: inherit

  build_dev_5:
    needs: check_patch
    if: ${{ needs.check_patch.outputs.trigger_prerelease == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.dev.part5.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.dev.part5.json"
    secrets: inherit

  build_stable_1:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.stable.part1.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part1.json"
    secrets: inherit

  build_stable_2:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.stable.part2.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part2.json"
    secrets: inherit

  build_stable_3:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.stable.part3.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part3.json"
    secrets: inherit

  build_stable_4:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.stable.part4.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part4.json"
    secrets: inherit

  build_stable_5:
    needs: [check_patch, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() && needs.check_patch.outputs.trigger_stable == '1' && needs.check_patch.result == 'success' && hashFiles('configs/config.stable.part5.json') != '' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.stable.part5.json"
    secrets: inherit

  trigger_cleanup:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5]
    if: ${{ always() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_stable_1, build_stable_2, build_stable_3, build_stable_4, build_stable_5, build_dev_1, build_dev_2, build_dev_3, build_dev_4, build_dev_5, trigger_cleanup]
    if: ${{ always() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
