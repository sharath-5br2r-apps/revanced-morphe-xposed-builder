name: Manual CI
permissions: write-all
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Select the config file to use"
        required: true
        type: choice
        default: "configs/config.manual.generated.toml"
        options:
          - "configs/config.manual.generated.toml"
          - "configs/config.manual.toml"
          - "configs/config.dev.updated.json"
          - "configs/config.stable.updated.json"
      manual_config_file:
        description: "Optional: Enter the config file name(without ext) in patches or config file path(with ext)manually, overrides above choice"
        required: false
        type: string
        default: ""
      exclusive_apps:
        description: "Optional: Enter the toml table names or regex pattern of the apps you want to build. When empty, all apps are built."
        required: false
        type: string
        default: ""
      remove_apks:
        description: "Optional: APKs to remove from cache (regex, e.g., com.brave.browser-1.93.138-.*\\.apk)"
        required: false
        type: string
        default: ""
      patches_version:
        description: "Optional: Override patches-version (e.g. latest, auto, exp, or specific version string like 4.2.0)"
        required: false
        type: string
        default: ""

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  resolve_config:
    runs-on: ubuntu-latest
    outputs:
      config_file: ${{ steps.config.outputs.config_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve config file
        id: config
        run: |
          if [[ -n  "${{ inputs.manual_config_file }}" ]]; then
            manual_input="${{ inputs.manual_config_file }}"
            if [[ -f "$manual_input" ]]; then
              echo "CONFIG_FILE=$manual_input" >> "$GITHUB_OUTPUT"
            elif [[ -f "configs/patches/${manual_input}.toml" ]]; then
              echo "CONFIG_FILE=configs/patches/${manual_input}.toml" >> "$GITHUB_OUTPUT"
            elif [[ -f "configs/${manual_input}" ]]; then
              echo "CONFIG_FILE=configs/${manual_input}" >> "$GITHUB_OUTPUT"
            else
              echo "Config file '$manual_input' not found"
              exit 1
            fi
          else
            echo "CONFIG_FILE=${{ inputs.config_file }}" >> "$GITHUB_OUTPUT"
          fi
  build_manual:
    uses: ./.github/workflows/build.yml
    needs: resolve_config
    with:
      config_file: ${{ needs.resolve_config.outputs.config_file }}
      exclusive_apps: ${{ inputs.exclusive_apps }}
      remove_apks: ${{ inputs.remove_apks }}
      patches_version: ${{ inputs.patches_version }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_manual, trigger_cleanup]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
