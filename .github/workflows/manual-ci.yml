name: Manual CI
permissions: write-all
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Config file to use"
        required: true
        type: choice
        default: "configs/config.manual.generated.toml"
        options:
          - "configs/config.manual.generated.toml"
          - "configs/config.manual.toml"
      manual_config_file:
        description: "Optional: Custom config file path or patch name (overrides choice)"
        required: false
        type: string
        default: ""
      mode:
        description: "Execution mode"
        required: false
        type: choice
        default: "Default"
        options:
          - "Default"
          - "Build Only"
      exclusive_apps:
        description: "Optional: Filter app table names/regex"
        required: false
        type: string
        default: ""
      remove_apks:
        description: "Optional: Remove cached APKs (regex)"
        required: false
        type: string
        default: ""
      patches_version:
        description: "Optional: Override patches-version"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: "Default"
      patches_version:
        required: false
        type: string
        default: ""

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  update_versions:
    if: ${{ inputs.mode == 'Update Versions Only' || inputs.mode == 'Default' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest tags & app versions
        id: update
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/ci_ensure_patch_sources.sh || true
          bash .github/scripts/ci_fetch_tags.sh || true
          bash .github/scripts/ci_fetch_app_versions.sh || true
          bash .github/scripts/ci_generate_configs.sh || true
          python3 .github/scripts/ci_merge_patch_tomls.py || true

      - name: Commit updated versions metadata and configs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/app_versions.json configs/patch_sources.json configs/config.*.updated.json configs/patches/merged/*.toml
          commit_message: "Update patch sources, app versions and generated configs [skip ci]"

  resolve_config:
    needs: update_versions
    if: ${{ !cancelled() && inputs.mode != 'Update Versions Only' }}
    runs-on: ubuntu-latest
    outputs:
      config_file: ${{ steps.config.outputs.config_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve config file
        id: config
        run: |
          if [[ -n  "${{ inputs.manual_config_file }}" ]]; then
            manual_input="${{ inputs.manual_config_file }}"
            if [[ -f "$manual_input" ]]; then
              echo "CONFIG_FILE=$manual_input" >> "$GITHUB_OUTPUT"
            elif [[ -f "configs/patches/${manual_input}.toml" ]]; then
              echo "CONFIG_FILE=configs/patches/${manual_input}.toml" >> "$GITHUB_OUTPUT"
            elif [[ -f "configs/${manual_input}" ]]; then
              echo "CONFIG_FILE=configs/${manual_input}" >> "$GITHUB_OUTPUT"
            else
              echo "Config file '$manual_input' not found"
              exit 1
            fi
          else
            echo "CONFIG_FILE=${{ inputs.config_file || 'configs/config.manual.generated.toml' }}" >> "$GITHUB_OUTPUT"
          fi
  build_manual:
    uses: ./.github/workflows/build.yml
    needs: [update_versions, resolve_config]
    if: ${{ !cancelled() && inputs.mode != 'Update Versions Only' && needs.resolve_config.result == 'success' }}
    with:
      config_file: ${{ needs.resolve_config.outputs.config_file }}
      exclusive_apps: ${{ inputs.exclusive_apps }}
      remove_apks: ${{ inputs.remove_apks }}
      patches_version: ${{ inputs.patches_version }}
    secrets: inherit

  trigger_cleanup:
    needs: [update_versions, build_manual]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [update_versions, build_manual, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
