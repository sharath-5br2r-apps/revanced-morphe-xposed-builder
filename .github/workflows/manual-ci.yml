name: Manual CI
permissions: write-all
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Select the config file to use"
        required: true
        type: choice
        default: "configs/config.manual.generated.toml"
        options:
          - "configs/config.manual.generated.toml"
          - "configs/config.manual.toml"
          - "configs/config.dev.updated.json"
          - "configs/config.stable.updated.json"
          - "Enter Manually"
      manual_config_file:
        description: "Enter the config file name(without ext) in patches or config file path(with ext)manually (only if 'Enter Manually' is selected above)"
        required: false
        type: string
      exclusive_apps:
        description: "Enter the toml table names of the only apps you want to build. When empty, all apps are built."
        required: false
        type: string
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  resolve_config:
    runs-on: ubuntu-latest
    outputs:
      config_file: ${{ steps.config.outputs.config_file }}
    steps:
      - name: Resolve config file
        id: config
        run: |
          if [[ "${{ inputs.config_file }}" == "Enter Manually" ]]; then
            patches_config_file="configs/patches/${{ inputs.manual_config_file }}.toml" 
            if [[ -f "$patches_config_file" ]]; then
              echo "CONFIG_FILE=$patches_config_file" >> "$GITHUB_OUTPUT"
            elif [[ -f "${{ inputs.manual_config_file }}" ]]; then
              echo "CONFIG_FILE=${{ inputs.manual_config_file }}" >> "$GITHUB_OUTPUT"
            else
              echo "Config file ${{ inputs.manual_config_file }} not found"
              exit 1
            fi
          else
            echo "CONFIG_FILE=${{ inputs.config_file }}" >> "$GITHUB_OUTPUT"
          fi
  build_manual:
    uses: ./.github/workflows/build.yml
    needs: resolve_config
    with:
      config_file: ${{ needs.resolve_config.outputs.config_file }}
      exclusive_apps: ${{ inputs.exclusive_apps }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_manual, trigger_cleanup]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit

