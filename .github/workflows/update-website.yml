name: Update Website

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  dispatch_update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch Website Deployment
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.WEBSITE_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_REPO="${{ vars.WEBSITE_REPO || 'sharath-5br2r-apps/sharath-5br2r-apps.github.io' }}"
          curl -f -X POST "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token $DISPATCH_TOKEN" \
          -d '{"event_type": "update-catalog-cache"}'
