name: Update Website

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  dispatch_update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch Website Cache Update
        env:
          PAT_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${PAT_TOKEN:-$GH_TOKEN}"
          if [ -n "$TOKEN" ]; then
            curl -X POST https://api.github.com/repos/sharath-5br2r-apps/sharath-5br2r-apps.github.io/dispatches \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $TOKEN" \
              -d '{"event_type": "update-catalog-cache"}'
          fi
