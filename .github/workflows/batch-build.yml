name: "Batch Build All Configs"
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Select patches-version override (latest or absolutelatest)"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "absolutelatest"
          
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  prepare_context:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code: ${{ steps.version.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_batch:
    needs: [prepare_context]
    if: ${{ !cancelled() && needs.prepare_context.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        config_file: ["configs/patches/merged/batch-part1.toml", "configs/patches/merged/batch-part2.toml", "configs/patches/merged/batch-part3.toml", "configs/patches/merged/batch-part4.toml", "configs/patches/merged/batch-part5.toml", "configs/patches/merged/batch-part6.toml", "configs/patches/merged/batch-part7.toml", "configs/patches/merged/batch-part8.toml", "configs/patches/merged/batch-part9.toml", "configs/patches/merged/batch-part10.toml", "configs/patches/merged/batch-part11.toml", "configs/patches/merged/batch-part12.toml", "configs/patches/merged/batch-part13.toml", "configs/patches/merged/batch-part14.toml", "configs/patches/merged/batch-part15.toml", "configs/patches/merged/batch-part16.toml"]
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ matrix.config_file }}
      patches_version: ${{ inputs.patches_version }}
      release_version_code: ${{ needs.prepare_context.outputs.next_ver_code }}
      upload_release_metadata: false
    secrets: inherit

  aggregate_logs:
    needs: [prepare_context, build_batch]
    if: ${{ !cancelled() && needs.build_batch.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs
        run: |
          mkdir -p batch_logs
          cp -r logs_artifacts/* batch_logs/ 2>/dev/null || true
          cd batch_logs
          FLAVOR="stable"
          if [ "${{ inputs.patches_version }}" = "absolutelatest" ] || [ "${{ inputs.patches_version }}" = "dev" ]; then
            FLAVOR="dev"
          fi
          bash ../.github/scripts/build_aggregate_logs.sh "$FLAVOR"
          cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-build-logs
          path: batch_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Prepare build.json for release upload
        run: |
          if [ -d "batch_logs/aggregated_out" ]; then
            for json_file in batch_logs/aggregated_out/build.*.json; do
              if [ -f "$json_file" ]; then
                cp -f "$json_file" build.json
              fi
            done
            for md_file in batch_logs/aggregated_out/build.*.md; do
              if [ -f "$md_file" ]; then
                cp -f "$md_file" build.md
              fi
            done
          fi

      - name: Upload build.json to numbered release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare_context.outputs.next_ver_code }}"
          if [ -n "$tag" ] && [ -s "build.json" ]; then
            notes_arg=("--notes" "")
            [ -s "build.md" ] && notes_arg=("--notes-file" "build.md")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -s "build.md" ] && gh release edit "$tag" --notes-file "build.md" || true
            else
              gh release create "$tag" --title "Build No. $tag" "${notes_arg[@]}" || true
            fi
            for file in build.json build.md; do
              if [ -s "$file" ]; then
                echo "Uploading $file to release $tag..."
                gh release upload "$tag" "$file" --clobber || {
                  echo "::warning::Failed to upload $file to release $tag, retrying..."
                  sleep 3
                  gh release upload "$tag" "$file" --clobber || echo "::warning::Failed to upload $file to release $tag"
                }
              fi
            done
          fi

      - name: Upload module update metadata to update tag
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "batch_logs" ]; then
            for file in $(find batch_logs -name "*-update.json"); do
              if [ -s "$file" ]; then
                echo "Uploading $file to release update..."
                gh release upload update "$file" --clobber || {
                  echo "::warning::Failed to upload $file to release update, retrying..."
                  sleep 3
                  gh release upload update "$file" --clobber || echo "::warning::Failed to upload $file to release update"
                }
              fi
            done
          fi

  trigger_cleanup:
    needs: [build_batch, aggregate_logs]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_batch, aggregate_logs, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
