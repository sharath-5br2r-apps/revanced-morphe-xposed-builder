name: "Batch Build All Configs"
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Select patches-version override (latest or absolutelatest)"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "absolutelatest"
      mode:
        description: "Execution mode"
        required: false
        type: choice
        default: "Default"
        options:
          - "Default"
          - "Build Only"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  update_versions:
    uses: ./.github/workflows/manual-ci.yml
    with:
      mode: ${{ inputs.mode }}
      patches_version: ${{ inputs.patches_version }}
    secrets: inherit

  prepare_context:
    needs: update_versions
    if: ${{ !cancelled() && inputs.mode != 'Update Versions Only' }}
    runs-on: ubuntu-latest
    outputs:
      next_ver_code: ${{ steps.version.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve next version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

  build_batch:
    needs: [update_versions, prepare_context]
    if: ${{ !cancelled() && inputs.mode != 'Update Versions Only' && needs.prepare_context.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        config_file: ["configs/patches/merged/batch-part1.toml", "configs/patches/merged/batch-part2.toml", "configs/patches/merged/batch-part3.toml", "configs/patches/merged/batch-part4.toml", "configs/patches/merged/batch-part5.toml", "configs/patches/merged/batch-part6.toml", "configs/patches/merged/batch-part7.toml", "configs/patches/merged/batch-part8.toml", "configs/patches/merged/batch-part9.toml", "configs/patches/merged/batch-part10.toml", "configs/patches/merged/batch-part11.toml", "configs/patches/merged/batch-part12.toml", "configs/patches/merged/batch-part13.toml", "configs/patches/merged/batch-part14.toml", "configs/patches/merged/batch-part15.toml"]
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ matrix.config_file }}
      patches_version: ${{ inputs.patches_version }}
      release_version_code: ${{ needs.prepare_context.outputs.next_ver_code }}
      upload_release_metadata: false
    secrets: inherit

  aggregate_logs:
    needs: [prepare_context, build_batch]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: part-logs-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs
        run: |
          mkdir -p batch_logs
          cp -r logs_artifacts/* batch_logs/ 2>/dev/null || true
          cd batch_logs
          FLAVOR="stable"
          if [ "${{ inputs.patches_version }}" = "absolutelatest" ] || [ "${{ inputs.patches_version }}" = "dev" ]; then
            FLAVOR="dev"
          fi
          bash ../.github/scripts/build_aggregate_logs.sh "$FLAVOR"
          cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-build-logs
          path: batch_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Prepare build.json for release upload
        run: |
          if [ -d "batch_logs/aggregated_out" ]; then
            for json_file in batch_logs/aggregated_out/build.*.json; do
              if [ -f "$json_file" ]; then
                cp -f "$json_file" build.json
              fi
            done
            for md_file in batch_logs/aggregated_out/build.*.md; do
              if [ -f "$md_file" ]; then
                cp -f "$md_file" build.md
              fi
            done
          fi

      - name: Upload build.json to numbered release via softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: build.json
          name: Build No. ${{ needs.prepare_context.outputs.next_ver_code }}
          tag_name: ${{ needs.prepare_context.outputs.next_ver_code }}
          overwrite_files: true

      - name: Upload module update metadata to update tag
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "batch_logs" ]; then
            find batch_logs -name "*-update.json" -exec gh release upload update {} --clobber \; 2>/dev/null || true
          fi

  trigger_cleanup:
    needs: [update_versions, build_batch, aggregate_logs]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [update_versions, build_batch, aggregate_logs, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
