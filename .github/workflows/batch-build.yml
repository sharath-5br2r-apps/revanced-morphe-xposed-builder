name: "Batch Build All Configs"
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Select patches-version override (latest, auto, or absolutelatest)"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "auto"
          - "absolutelatest"
      artifact_mode:
        description: "Use artifact mode (build as artifacts first, then aggregate build.json & release at end)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  update_versions:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAWL_URL: "http://localhost:8191"
      CFB_URL: "http://localhost:8000"
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure patch_sources.json exists
        id: ensure_patch_sources
        run: bash .github/scripts/ci_ensure_patch_sources.sh

      - name: Commit dummy patch_sources.json if created
        if: steps.ensure_patch_sources.outputs.created == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/patch_sources.json
          commit_message: "Create dummy patch_sources.json"

      - name: Fetch latest tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_tags
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci_fetch_tags.sh

      - name: Compare latest vs stored tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare
        env:
          LATEST_TAGS: ${{ steps.fetch_tags.outputs.latest }}
        run: bash .github/scripts/ci_compare_tags.sh

      - name: Fetch App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_app_versions
        run: bash .github/scripts/ci_fetch_app_versions.sh

      - name: Compare App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare_apps
        env:
          FETCHED_APP_VERSIONS: ${{ steps.fetch_app_versions.outputs.fetched }}
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Generate configs (JSON)
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        id: generate_configs
        env:
          TAGS_OLD: ${{ steps.compare.outputs.tags_old }}
          TAGS_NEW: ${{ steps.compare.outputs.tags_new }}
          TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE }}
          TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          DISABLE_CONFIG_UPDATE: "false"
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Determine next release version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

      - name: Commit updated patch_sources.json and configs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          file_pattern: configs/*.json
          commit_message: "Update patch sources, app versions and generated configs [skip ci]"

  build_batch_part1:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part1.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part2:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part2.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part3:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part3.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part4:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part4.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part5:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part5.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part6:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part6.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part7:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part7.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part8:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part8.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part9:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part9.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  build_batch_part10:
    needs: update_versions
    if: ${{ always() && needs.update_versions.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/patches/merged/batch-part10.toml"
      patches_version: ${{ inputs.patches_version }}
      artifact_mode: ${{ inputs.artifact_mode }}
    secrets: inherit

  aggregate_and_release:
    needs:
      - update_versions
      - build_batch_part1
      - build_batch_part2
      - build_batch_part3
      - build_batch_part4
      - build_batch_part5
      - build_batch_part6
      - build_batch_part7
      - build_batch_part8
      - build_batch_part9
      - build_batch_part10
    if: ${{ always() && inputs.artifact_mode == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download metadata & note artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge build.json and notes
        run: |
          python3 .github/scripts/ci_aggregate_build_json.py

      - name: Determine next release version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

      - name: Upload aggregated build.json to release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          [ -f build.json ] && gh release upload ${{ steps.version.outputs.NEXT_VER_CODE }} build.json \
            --repo "$GITHUB_REPOSITORY" --clobber || true

      - name: Update changelog and module update files
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_update_changelog.sh

      - name: Filter update files for release
        run: |
          mkdir -p update_meta/
          [ -s build.md ] && cp -f build.md update_meta/ || true
          for f in *-update.json; do
            [ -f "$f" ] && [ -s "$f" ] && cp -f "$f" update_meta/ || true
          done

      - name: Upload module update metadata to release (update)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: update_meta/*
          name: Update Metadata
          tag_name: update
          overwrite_files: true
