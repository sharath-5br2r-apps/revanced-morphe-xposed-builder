name: "Batch Build All Configs"
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Select patches-version override (latest or absolutelatest)"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "absolutelatest"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build_batch:
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        config_file: ["configs/patches/merged/batch-part1.toml", "configs/patches/merged/batch-part2.toml", "configs/patches/merged/batch-part3.toml", "configs/patches/merged/batch-part4.toml", "configs/patches/merged/batch-part5.toml", "configs/patches/merged/batch-part6.toml", "configs/patches/merged/batch-part7.toml", "configs/patches/merged/batch-part8.toml", "configs/patches/merged/batch-part9.toml", "configs/patches/merged/batch-part10.toml", "configs/patches/merged/batch-part11.toml", "configs/patches/merged/batch-part12.toml", "configs/patches/merged/batch-part13.toml", "configs/patches/merged/batch-part14.toml"]
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ matrix.config_file }}
      patches_version: ${{ inputs.patches_version }}
      upload_release_metadata: false
    secrets: inherit

  aggregate_logs:
    needs: [build_batch]
    if: ${{ always() && needs.build_batch.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: part-logs-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs
        run: |
          mkdir -p batch_logs
          find logs_artifacts -exec cp -r {}/. batch_logs/ \; 2>/dev/null || true
          cd batch_logs
          FLAVOR="stable"
          if [ "${{ inputs.patches_version }}" = "absolutelatest" ] || [ "${{ inputs.patches_version }}" = "dev" ]; then
            FLAVOR="dev"
          fi
          bash ../.github/scripts/build_aggregate_logs.sh "$FLAVOR"
          cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-build-logs
          path: batch_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Prepare build.json and build.md for release upload
        run: |
          TARGET_TAG="stable"
          if [ "${{ inputs.patches_version }}" = "absolutelatest" ] || [ "${{ inputs.patches_version }}" = "dev" ]; then
            TARGET_TAG="beta"
          fi
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          if [ -d "batch_logs/aggregated_out" ]; then
            for json_file in batch_logs/aggregated_out/build.*.json; do
              if [ -f "$json_file" ]; then
                cp -f "$json_file" build.json
              fi
            done
            for md_file in batch_logs/aggregated_out/build.*.md; do
              if [ -f "$md_file" ]; then
                cp -f "$md_file" build.md
              fi
            done
          fi

      - name: Upload build.json and build.md to target release tag via softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            build.json
            build.md
          body_path: build.md
          name: ${{ env.TARGET_TAG }}
          tag_name: ${{ env.TARGET_TAG }}
          overwrite_files: true

      - name: Upload module update metadata to update tag
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "batch_logs" ]; then
            find batch_logs -name "*-update.json" -exec gh release upload update {} --clobber \; 2>/dev/null || true
          fi

  trigger_cleanup:
    needs: [build_batch, aggregate_logs]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_batch, aggregate_logs, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
