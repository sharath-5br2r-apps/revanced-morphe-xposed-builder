name: "Batch Build All Configs"
permissions: write-all

on:
  workflow_dispatch:
    inputs:
      patches_version:
        description: "Select patches-version override (latest, auto, or absolutelatest)"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "auto"
          - "absolutelatest"

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  update_versions:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
    env:
      TRAWL_URL: "http://localhost:8191"
      CFB_URL: "http://localhost:8000"
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure patch_sources.json exists
        id: ensure_patch_sources
        run: bash .github/scripts/ci_ensure_patch_sources.sh

      - name: Commit dummy patch_sources.json if created
        if: steps.ensure_patch_sources.outputs.created == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          skip_checkout: true
          file_pattern: configs/patch_sources.json
          commit_message: "Create dummy patch_sources.json"

      - name: Fetch latest tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_tags
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ci_fetch_tags.sh

      - name: Compare latest vs stored tags
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare
        env:
          LATEST_TAGS: ${{ steps.fetch_tags.outputs.latest }}
        run: bash .github/scripts/ci_compare_tags.sh

      - name: Fetch App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: fetch_app_versions
        run: bash .github/scripts/ci_fetch_app_versions.sh

      - name: Compare App Versions
        if: steps.ensure_patch_sources.outputs.created == 'false'
        id: compare_apps
        env:
          FETCHED_APP_VERSIONS: ${{ steps.fetch_app_versions.outputs.fetched }}
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Generate configs (JSON)
        if: ${{ steps.ensure_patch_sources.outputs.created == 'false' && (steps.compare.outputs.TRIGGER_STABLE == '1' || steps.compare.outputs.TRIGGER_PRERELEASE == '1' || steps.compare.outputs.TRIGGER_BLOCKED == '1' || steps.compare_apps.outputs.TRIGGER_APP_UPDATE == '1') }}
        id: generate_configs
        env:
          TAGS_OLD: ${{ steps.compare.outputs.tags_old }}
          TAGS_NEW: ${{ steps.compare.outputs.tags_new }}
          TRIGGER_STABLE: ${{ steps.compare.outputs.TRIGGER_STABLE }}
          TRIGGER_PRERELEASE: ${{ steps.compare.outputs.TRIGGER_PRERELEASE }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE }}
          DISABLE_CONFIG_UPDATE: "false"
        run: bash .github/scripts/ci_generate_configs.sh

      - name: Determine next release version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

      - name: Normalize patches TOMLs
        run: python3 .github/scripts/ci_merge_patch_tomls.py

      - name: Commit updated patch_sources.json and configs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          file_pattern: configs/*.json
          commit_message: "Update patch sources, app versions and generated configs [skip ci]"

  build_batch:
    needs: update_versions
    if: ${{ !cancelled() && needs.update_versions.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        config_file: ["configs/patches/merged/batch-part1.toml", "configs/patches/merged/batch-part2.toml", "configs/patches/merged/batch-part3.toml", "configs/patches/merged/batch-part4.toml", "configs/patches/merged/batch-part5.toml", "configs/patches/merged/batch-part6.toml", "configs/patches/merged/batch-part7.toml", "configs/patches/merged/batch-part8.toml", "configs/patches/merged/batch-part9.toml", "configs/patches/merged/batch-part10.toml", "configs/patches/merged/batch-part11.toml", "configs/patches/merged/batch-part12.toml", "configs/patches/merged/batch-part13.toml", "configs/patches/merged/batch-part14.toml"]
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ matrix.config_file }}
      patches_version: ${{ inputs.patches_version }}
      release_version_code: ${{ needs.update_versions.outputs.NEXT_VER_CODE }}
      upload_release_metadata: false
    secrets: inherit

  aggregate_logs:
    needs: [update_versions, build_batch]
    if: ${{ always() && needs.update_versions.result == 'success' && needs.build_batch.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all part-logs artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: part-logs-*
          path: logs_artifacts
          merge-multiple: false

      - name: Aggregate logs
        run: |
          mkdir -p batch_logs
          find logs_artifacts -exec cp -r {}/. batch_logs/ \; 2>/dev/null || true
          cd batch_logs && bash ../.github/scripts/build_aggregate_logs.sh stable && cd ..

      - name: Upload aggregated logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-build-logs
          path: batch_logs/aggregated_out/*
          if-no-files-found: ignore

      - name: Upload aggregated metadata to release (update)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "batch_logs/aggregated_out" ]; then
            [ -f "batch_logs/aggregated_out/build.stable.json" ] && gh release upload update batch_logs/aggregated_out/build.stable.json --clobber || true
            [ -f "batch_logs/aggregated_out/build.stable.md" ] && gh release upload update batch_logs/aggregated_out/build.stable.md --clobber || true
          fi

  trigger_cleanup:
    needs: [build_batch, aggregate_logs]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_batch, aggregate_logs, trigger_cleanup]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit
