name: Build

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
      exclusive_apps:
        required: false
        type: string
      remove_apks:
        required: false
        type: string
        default: ""
      patches_version:
        required: false
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/lib/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk* /usr/local/lib/android/sdk/platforms
          sudo rm -rf /opt/ghc /usr/local/env/ghc /usr/local/.ghcup /usr/local/share/.ghcup ~/.ghcup /root/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf "$RUNNER_TOOL_CACHE" "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/local/julia* /usr/local/share/vcpkg /opt/pipx
          sudo rm -rf /var/log/journal/*
          sudo docker image prune --all --force || true
          df -h

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Resolve build context
        id: context
        run: |
          bash scripts/generate_manual_config.sh
          bash .github/scripts/build_resolve_context.sh "${{ inputs.config_file }}"

      - name: Resolve version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

      - name: Cache APKs
        uses: actions/cache@v4
        with:
          path: temp/apks
          key: apks-v4-${{ hashFiles('configs/app_versions.json', 'configs/patches/**/*.toml') }}

      - name: Remove specific APKs from cache
        if: ${{ inputs.remove_apks != '' }}
        run: |
           if [ -d "temp/apks" ]; then
            cd temp/apks
            find . -maxdepth 1 -type f -regextype posix-extended -regex ".*/(${{ inputs.remove_apks }})" -exec rm -f {} +
           fi

      - name: Build modules and apks
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          APKS_REPO: ${{ vars.APKS_REPO }}
          UPLOAD_APKS_REPO: ${{ vars.APKS_REPO }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          TRAWL_URL: "http://localhost:8191"
          CFB_URL: "http://localhost:8000"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
          OVERRIDE_PATCHES_VERSION: ${{ inputs.patches_version }}
        run: |
          set -euo pipefail
          bash ./build.sh "${{ steps.context.outputs.CONFIG_FILE }}" "${{ inputs.exclusive_apps }}"

      - name: Update Usage Tracker
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          APKS_REPO: ${{ vars.APKS_REPO }}
        run: |
          if [ -n "${APKS_REPO:-}" ] && [ -n "${PERSONAL_ACCESS_TOKEN:-}" ]; then
            python3 .github/scripts/update_usage_tracker.py || true
          else
            echo "APKS_REPO or PERSONAL_ACCESS_TOKEN is not present. Skipping usage tracker update."
          fi

      - name: Cleanup old cached APKs
        run: bash .github/scripts/build_cache_cleanup.sh

      - name: Get output
        id: get_output
        run: bash .github/scripts/build_get_output.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.get_output.outputs.BUILD_LOG }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: ./build/*
          name: Build No. ${{ steps.version.outputs.NEXT_VER_CODE }}
          tag_name: ${{ steps.version.outputs.NEXT_VER_CODE }}
          overwrite_files: true
          prerelease: ${{ steps.context.outputs.IS_PRERELEASE == 'true' }}

      - name: Upload build.json to numbered release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.version.outputs.NEXT_VER_CODE }} build.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update changelog and module update files
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_update_changelog.sh

      - name: Upload module update metadata to release (update)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            build.md
            *-update.json
          name: Update Metadata
          tag_name: update
          overwrite_files: true

      - name: Remove frequently updated apps
        run: |
          bash .github/scripts/build_exclude_from_archive.sh

      - name: Upload to release (Archive)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          files: ./build/*
          tag_name: ${{ steps.context.outputs.ARCHIVE_TAG }}
          overwrite_files: true
          target_commitish: main
