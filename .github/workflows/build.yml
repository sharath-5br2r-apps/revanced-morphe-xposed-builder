name: Build

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
      exclusive_apps:
        required: false
        type: string
      remove_apks:
        required: false
        type: string
        default: ""
      patches_version:
        required: false
        type: string
        default: ""
      release_version_code:
        required: false
        type: string
        default: ""
      upload_release_metadata:
        description: "Upload build.json and build.md directly to release (set false when aggregate job handles release metadata)"
        required: false
        type: boolean
        default: true

concurrency:
  group: build-${{ inputs.config_file }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      next_ver_code: ${{ steps.version.outputs.NEXT_VER_CODE }}
      archive_tag: ${{ steps.context.outputs.ARCHIVE_TAG }}
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cfb:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Normalize patches TOMLs
        run: python3 .github/scripts/ci_merge_patch_tomls.py

      - name: Resolve build context
        id: context
        env:
          OVERRIDE_PATCHES_VERSION: ${{ inputs.patches_version }}
        run: |
          bash scripts/generate_manual_config.sh
          bash .github/scripts/build_resolve_context.sh "${{ inputs.config_file }}"

      - name: Resolve version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          PASSED_VER_CODE: ${{ inputs.release_version_code }}
        run: |
          if [ -n "$PASSED_VER_CODE" ]; then
            echo "NEXT_VER_CODE=$PASSED_VER_CODE" >> "$GITHUB_OUTPUT"
            echo "[+] Using passed release version code: $PASSED_VER_CODE"
          else
            bash .github/scripts/build_resolve_version.sh
          fi

      - name: Cache APKs
        uses: actions/cache@v6
        with:
          path: temp/apks
          key: apks-v4-${{ hashFiles(inputs.config_file, 'configs/app_versions.json') }}
          restore-keys: |
            apks-v4-

      - name: Remove specific APKs from cache
        if: ${{ inputs.remove_apks != '' }}
        run: |
           if [ -d "temp/apks" ]; then
            cd temp/apks
            find . -maxdepth 1 -type f -regextype posix-extended -regex ".*/(${{ inputs.remove_apks }})" -exec rm -f {} +
           fi

      - name: Build modules and apks
        if: ${{ steps.context.outputs.HAS_ENABLED_APPS != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          APKS_REPO: ${{ vars.APKS_REPO }}
          UPLOAD_APKS_REPO: ${{ vars.APKS_REPO }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          TRAWL_URL: "http://localhost:8191"
          CFB_URL: "http://localhost:8000"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS }}
          OVERRIDE_PATCHES_VERSION: ${{ inputs.patches_version }}
        run: |
          set -euo pipefail
          bash ./build.sh "${{ steps.context.outputs.CONFIG_FILE }}" "${{ inputs.exclusive_apps }}"

      - name: Update Usage Tracker
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          APKS_REPO_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          APKS_REPO: ${{ vars.APKS_REPO }}
          APKS_REPO_URL: ${{ vars.APKS_REPO }}
        run: |
          if [ -n "${APKS_REPO:-}" ] && [ -n "${PERSONAL_ACCESS_TOKEN:-}" ]; then
            python3 .github/scripts/update_usage_tracker.py || true
          else
            echo "APKS_REPO or PERSONAL_ACCESS_TOKEN is not present. Skipping usage tracker update."
          fi

      - name: Cleanup old cached APKs
        run: bash .github/scripts/build_cache_cleanup.sh

      - name: Get output
        id: get_output
        run: bash .github/scripts/build_get_output.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.NEXT_VER_CODE }}"
          prerelease_flag=""
          [ "${{ steps.context.outputs.IS_PRERELEASE }}" = "true" ] && prerelease_flag="--prerelease"
          notes_arg=("--notes" "")
          if [ "${{ inputs.upload_release_metadata }}" != "false" ] && [ -f "build.md" ]; then
            notes_arg=("--notes-file" "build.md")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            [ -f "build.md" ] && gh release edit "$tag" --notes-file "build.md" || true
          else
            gh release create "$tag" --title "Build No. $tag" "${notes_arg[@]}" $prerelease_flag || true
          fi
          if [ -d "./build" ]; then
            for file in ./build/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file to release $tag..."
                gh release upload "$tag" "$file" --clobber || {
                  echo "::warning::Failed to upload $file to release $tag, retrying..."
                  sleep 3
                  gh release upload "$tag" "$file" --clobber || echo "::warning::Failed to upload $file to release $tag"
                }
              fi
            done
          fi

      - name: Upload build.json to numbered release
        if: ${{ inputs.upload_release_metadata != false }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.NEXT_VER_CODE }}"
          if [ -f "build.json" ]; then
            notes_arg=("--notes" "")
            [ -f "build.md" ] && notes_arg=("--notes-file" "build.md")
            if gh release view "$tag" >/dev/null 2>&1; then
              [ -f "build.md" ] && gh release edit "$tag" --notes-file "build.md" || true
            else
              gh release create "$tag" --title "Build No. $tag" "${notes_arg[@]}" || true
            fi
            for file in build.json build.md; do
              if [ -f "$file" ]; then
                echo "Uploading $file to release $tag..."
                gh release upload "$tag" "$file" --clobber || {
                  echo "::warning::Failed to upload $file to release $tag, retrying..."
                  sleep 3
                  gh release upload "$tag" "$file" --clobber || echo "::warning::Failed to upload $file to release $tag"
                }
              fi
            done
          fi

      - name: Upload part build logs artifact
        uses: actions/upload-artifact@v7
        with:
          name: part-logs-${{ steps.context.outputs.ARCHIVE_TAG }}-${{ steps.context.outputs.CONFIG_TAG || strategy.job-index || '0' }}-${{ github.job }}
          path: |
            build.json
            build.md
            build.tmp
          if-no-files-found: ignore

      - name: Update changelog and module update files
        if: ${{ inputs.upload_release_metadata != false }}
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_update_changelog.sh

      - name: Upload module update metadata to release (update)
        if: ${{ inputs.upload_release_metadata != false }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release view "update" >/dev/null 2>&1 || gh release create "update" --title "Update Metadata" --notes "" || true
          for file in build.md *-update.json; do
            if [ -f "$file" ]; then
              echo "Uploading $file to release update..."
              gh release upload update "$file" --clobber || {
                echo "::warning::Failed to upload $file to release update, retrying..."
                sleep 3
                gh release upload update "$file" --clobber || echo "::warning::Failed to upload $file to release update"
              }
            fi
          done

      - name: Remove frequently updated apps
        run: |
          bash .github/scripts/build_exclude_from_archive.sh

      - name: Upload to release (Archive)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.context.outputs.ARCHIVE_TAG }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "" --target main || true
          if [ -d "./build" ]; then
            for file in ./build/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file to release $tag..."
                gh release upload "$tag" "$file" --clobber || {
                  echo "::warning::Failed to upload $file to release $tag, retrying..."
                  sleep 3
                  gh release upload "$tag" "$file" --clobber || echo "::warning::Failed to upload $file to release $tag"
                }
              fi
            done
          fi
