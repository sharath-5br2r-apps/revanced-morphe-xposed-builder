name: Build
run-name: "Build [Config: ${{ inputs.config_file }} , Patch Ver:${{ inputs.patches_version || 'Default' }}]"

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
      exclusive_apps:
        required: false
        type: string
      remove_apks:
        required: false
        type: string
        default: ""
      patches_version:
        required: false
        type: string
        default: ""
      release_version_code:
        required: false
        type: string
        default: ""
      upload_release_metadata:
        description: "Upload build metadata directly to the release"
        required: false
        type: boolean
        default: true
      aggregate_flavor:
        required: false
        type: string
        default: ""

concurrency:
  group: build-${{ inputs.config_file }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      next_ver_code: ${{ steps.version.outputs.NEXT_VER_CODE }}
      archive_tag: ${{ steps.context.outputs.ARCHIVE_TAG }}
      flavor_tag: ${{ steps.context.outputs.FLAVOR_TAG }}
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Setup Android build tools
        run: |
          sdk_dir="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$sdk_dir/build-tools" ]; then
            latest_bt=$(ls -d "$sdk_dir/build-tools"/* 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$latest_bt" ] && [ -d "$latest_bt" ]; then
              echo "$latest_bt" >> "$GITHUB_PATH"
            fi
          fi

      - name: Resolve build context
        id: context
        run: bash .github/scripts/build_resolve_context.sh "${{ inputs.config_file }}" "${{ inputs.patches_version }}"

      - name: Resolve version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASSED_VER_CODE: ${{ inputs.release_version_code }}
        run: |
          if [ -n "$PASSED_VER_CODE" ]; then
            echo "NEXT_VER_CODE=$PASSED_VER_CODE" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/build_resolve_version.sh
          fi

      - name: Restore APKs Cache
        uses: actions/cache/restore@v6
        with:
          path: temp/apks
          key: apks-v4-${{ hashFiles(inputs.config_file, 'configs/app_versions.json') }}
          restore-keys: |
            apks-v4-

      - name: Remove specific APKs from cache
        if: ${{ inputs.remove_apks != '' }}
        run: |
          if [ -d "temp/apks" ]; then
            cd temp/apks
            find . -maxdepth 1 -type f -regextype posix-extended -regex ".*/(${{ inputs.remove_apks }})" -exec rm -f {} +
          fi

      - name: Build modules and apks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.APKS_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          APKS_REPO_TOKEN: ${{ secrets.APKS_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          APKS_REPO: ${{ vars.APKS_REPO }}
          UPLOAD_APKS_REPO: "${{ vars.APKS_REPO }}"
          APKS_REPO_URL: "${{ vars.APKS_REPO_URL || vars.APKS_REPO }}"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          CFB_URL: "http://localhost:8000"
          RVB_MORPHE_PASSTHROUGH: "${{ vars.RVB_MORPHE_PASSTHROUGH || 'true' }}"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ vars.KEYSTORE_ALIAS || 'jhc' }}
          RELEASE_NOTES_WEBSITE_LINK: "${{ vars.RELEASE_NOTES_WEBSITE_LINK || 'https://sharath-5br2r.github.io/catalog' }}"
        run: |
          set -euo pipefail
          bash scripts/build.sh --config="${{ steps.context.outputs.CONFIG_FILE }}" --allowed-apps="${{ inputs.exclusive_apps }}" --patches-version="${{ inputs.patches_version }}"

      - name: Update Usage Tracker
        env:
          APKS_REPO_TOKEN: ${{ secrets.APKS_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          APKS_REPO: "${{ vars.APKS_REPO }}"
          APKS_REPO_URL: "${{ vars.APKS_REPO_URL || vars.APKS_REPO }}"
        run: python3 .github/scripts/update_usage_tracker.py || true
        
      - name: Cleanup old cached APKs
        run: bash .github/scripts/build_cache_cleanup.sh

      - name: Generate Cache Manifest
        if: always()
        run: |
          mkdir -p temp/apks
          find temp/apks/ -maxdepth 1 -type f -printf "%s %f\n" | sort > temp/cache_manifest.txt
          [ -s temp/cache_manifest.txt ] || rm -f temp/cache_manifest.txt

      - name: Save APKs Cache
        uses: actions/cache/save@v6
        continue-on-error: true
        if: always() && hashFiles('temp/cache_manifest.txt') != ''
        with:
          path: temp/apks
          key: apks-${{ hashFiles('temp/cache_manifest.txt') }}

      - name: Get output
        id: get_output
        run: bash .github/scripts/build_get_output.sh

      - name: Generate release manifest
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          IS_PRERELEASE: ${{ steps.context.outputs.IS_PRERELEASE }}
        run: | 
          cat build.json
          python3 .github/scripts/build_make_manifest.py
          cp -f temp/manifest/build.json build.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.NEXT_VER_CODE }}
          RELEASE_TITLE: "Build No. ${{ steps.version.outputs.NEXT_VER_CODE }}"
          RELEASE_BODY_FILE: build.md
          IS_PRERELEASE: ${{ steps.context.outputs.IS_PRERELEASE }}
          UPLOAD_FILES: "./build/*"
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_CONCURRENCY: "${{ vars.UPLOAD_CONCURRENCY || '4' }}"
        run: bash .github/scripts/build_upload_release.sh

      - name: Upload build manifest
        if: ${{ inputs.upload_release_metadata != false && hashFiles('temp/manifest/build.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.NEXT_VER_CODE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "build.json" --clobber -R "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 3))
          done
          echo "Failed to upload build.json after 3 attempts" >&2
          exit 1


      - name: Upload error log
        if: ${{ inputs.aggregate_flavor == '' && hashFiles('error.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: error_log
          path: error.log
          if-no-files-found: ignore

      - name: Update changelog and module update files
        id: update_changelog
        env:
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          ARCHIVE_TAG: ${{ steps.context.outputs.ARCHIVE_TAG }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_update_changelog.sh

      - name: Commit updated build and module update files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: update
          skip_checkout: true
          push_options: --force
          file_pattern: *-update.json
          commit_message: Bump version ${{ steps.version.outputs.NEXT_VER_CODE }}
      - name: Commit updated build and module update files(Changelog Only)
        uses: stefanzweifel/git-auto-commit-action@v7
        if: ${{ inputs.upload_release_metadata == false }}
        with:
          branch: update
          skip_checkout: true
          push_options: --force
          file_pattern: changelogs/*.md
          commit_message: Bump version ${{ steps.version.outputs.NEXT_VER_CODE }}
      - name: Remove frequently updated apps
        run: |
          git checkout -f main
          bash .github/scripts/build_exclude_from_archive.sh

      - name: Upload to release (Archive)
        id: archive_upload
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.context.outputs.ARCHIVE_TAG }}
          RELEASE_TITLE: ${{ steps.context.outputs.ARCHIVE_TAG }}
          RELEASE_NOTES: "Archive release for ${{ steps.context.outputs.ARCHIVE_TAG }} builds"
          RELEASE_TARGET: main
          UPLOAD_FILES: "./build/*"
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_CONCURRENCY: "${{ vars.UPLOAD_CONCURRENCY || '4' }}"
        run: bash .github/scripts/build_upload_release.sh

      - name: Merge and upload archive manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_TAG: ${{ steps.context.outputs.ARCHIVE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/merge_archive_manifest.sh

      - name: Upload part build metadata
        if: ${{ inputs.upload_release_metadata == false }}
        uses: actions/upload-artifact@v7
        with:
          name: part-logs-${{ inputs.aggregate_flavor || steps.context.outputs.FLAVOR_TAG || 'logs' }}-${{ steps.context.outputs.CONFIG_TAG || 'part' }}
          path: |
            build.json
            build.md
            error.log
            ${{ inputs.config_file }}
            if-no-files-found: ignore



      - name: Notify website catalog rebuild
        if: ${{ inputs.upload_release_metadata != false }}
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_TOKEN || secrets.WEBSITE_DISPATCH_TOKEN || secrets.WEBSITE_REPO_TOKEN || secrets.APKS_REPO_TOKEN || secrets.PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          WEBSITE_REPO: "${{ vars.WEBSITE_REPO || 'sharath-5br2r-apps/sharath-5br2r-apps.github.io' }}"
        run: |
          curl -fsS -X POST "https://api.github.com/repos/${WEBSITE_REPO}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -d '{"event_type": "catalog-updated"}' \
            || echo "::warning::Website catalog dispatch failed; the scheduled rebuild will converge."
