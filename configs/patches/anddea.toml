enable-module-update = true

# ── YouTube morphe-anddea (stock/AMOLED, default) ─────────────────────────────
[YouTube-Morphe-Anddea]
enabled = true
app-name = "YouTube"
cli-type = "morphe"
patch-brand = "Anddea"
build-mode = "both"
pkg-name = "com.google.android.youtube"
patches-source = "anddea/revanced-patches"
included-patches = "'MaterialYou'"
patcher-args = "-e 'Theme' -OdarkThemeBackgroundColor=@android:color/black --continue-on-error"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"

# ── YouTube morphe-anddea-amoled (#000000 explicit) ───────────────────────────
[YouTube-Morphe-Anddea-AMOLED]
enabled = true
app-name = "YouTube"
cli-type = "morphe"
patch-brand = "Anddea"
variant = "AMOLED"
build-mode = "both"
pkg-name = "com.google.android.youtube"
patches-source = "anddea/revanced-patches"
included-patches = "'MaterialYou'"
patcher-args = "-e 'Theme' -OdarkThemeBackgroundColor=#000000 -OlightThemeBackgroundColor=#FFFFFF --continue-on-error"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"

[YouTubeMusic-Morphe-Anddea]
enabled = true
app-name = "YouTube Music"
cli-type = "morphe"
patch-brand = "Anddea"
build-mode = "both"
arch = "arm64-v8a x86_64 armeabi-v7a x86"
pkg-name = "com.google.android.apps.youtube.music"
patches-source = "anddea/revanced-patches"
patcher-args = "-e 'Dark theme' -OdarkThemeBackgroundColor=@android:color/black --continue-on-error"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube-music"

# ── YouTube Music morphe-anddea-amoled (#000000 explicit) ─────────────────────
[YouTubeMusic-Morphe-Anddea-AMOLED]
enabled = true
app-name = "YouTube Music"
cli-type = "morphe"
patch-brand = "Anddea"
variant = "AMOLED"
build-mode = "both"
arch = "arm64-v8a x86_64 armeabi-v7a x86"
pkg-name = "com.google.android.apps.youtube.music"
patches-source = "anddea/revanced-patches"
patcher-args = "-e 'Dark theme' -OdarkThemeBackgroundColor=#000000 --continue-on-error"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube-music"

