enable-module-update = true
patches-version = "absolutelatest"

[youtube-music-morphe-anddea]
enabled = true
app-name = "youtube-music"
rv-brand = "morphe-anddea"
build-mode = "both"
arch = "arm64-v8a arm-v7a x86_64"
pkg-name = "com.google.android.apps.youtube.music"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "anddea/revanced-patches"
patcher-args = "-e 'Dark theme' -OdarkThemeBackgroundColor=@android:color/black --continue-on-error"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube-music"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.google.android.apps.youtube.music"
dpi = "nodpi anydpi auto"

