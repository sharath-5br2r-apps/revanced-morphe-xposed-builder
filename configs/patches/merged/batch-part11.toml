[BraveBrowser-Nightly-Morphe-Dh6k]
enabled = true
app-name = "Brave Browser"
engine-brand = "Morphe"
patch-brand = "Dh6k"
sub-variant = "Nightly"
version = "beta"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
pkg-name = "com.brave.browser_nightly"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "dh6k/morphe-patches"
patcher-args = "--continue-on-error"
github-dlurl = "https://github.com/brave/brave-browser/releases"
github-dlurl-regex = "arm64-v8a: (BraveMonoarm64|MonoArm64)\\.apk$ | arm-v7a: (BraveMonoarm|MonoArm)\\.apk$ | x86_64: (BraveMonox64|BraveMonoX64|Monox64|MonoX64|[xX]64)\\.apk$"
github-release-name-regex = "^Nightly v"


[AmazonIndia-Morphe-Rushiranpise]
enabled = true
app-name = "Amazon India"
engine-brand = "Morphe"
patch-brand = "Rushiranpise"
build-mode = "apk"
pkg-name = "in.amazon.mShop.android.shopping"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://amazon-india.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/amazon-mobile-llc/amazon-india-shop-pay"
patches-source = "rushiranpise/morphe-patches"
included-patches = "'Dark Mode' 'Open Links in Browser'"
excluded-patches = "'Hide Rufus Tab'"
custom-microg-patches = "'None'"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/in.amazon.mShop.android.shopping"

arch = "all arm64-v8a arm-v7a"


