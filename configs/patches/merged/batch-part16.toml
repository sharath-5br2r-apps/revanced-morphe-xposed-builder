# --- Batch TOML Part 16 (8 distinct apps, 8 builds) ---


[WindscribeVPN-Morphe-Rushiranpise]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Windscribe VPN"
engine-brand = "Morphe"
patch-brand = "Rushiranpise"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.windscribe.vpn"
custom-microg-patches = "'None'"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
pkg-name = "com.windscribe.vpn"
uptodown-dlurl = "https://windscribe.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/windscribe/windscribe-vpn"
apkcombo-dlurl = "https://apkcombo.com/windscribe/com.windscribe.vpn"
patches-source = "rushiranpise/morphe-patches"



[Speedtest-Morphe-BholeyKaBhakt-Experimental]
enabled = true
app-name = "Speedtest"
pkg-name = "org.zwanoo.android.speedtest"
engine-brand = "Morphe"
patch-brand = "BholeyKaBhakt"
sub-variant = "Experimental"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/org.zwanoo.android.speedtest"
version = "latest"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
cli-source = "MorpheApp/morphe-desktop"
