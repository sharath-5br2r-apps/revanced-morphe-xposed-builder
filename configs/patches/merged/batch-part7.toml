[gboard-morphe-jasonwu1994-adobo-clone]
enabled = true
app-name = "gboard"
rv-brand = "morphe-jasonwu1994-adobo-clone"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
