# --- Batch TOML Part 12 (8 distinct apps, 8 builds) ---


[Xodo-Morphe-Hoodles]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Xodo PDF"
engine-brand = "Morphe"
patch-brand = "Hoodles"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.xodo.pdf.reader"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
pkg-name = "com.xodo.pdf.reader"
uptodown-dlurl = "https://xodo-pdf-reader-editor.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/xodo-technologies-inc/xodo-pdf-reader-editor"
patches-source = "hoo-dles/morphe-patches"



[Truecaller-Morphe-Paresh]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Truecaller"
engine-brand = "Morphe"
patch-brand = "Paresh"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.truecaller"
build-mode = "both"
arch = "all arm64-v8a arm-v7a"
pkg-name = "com.truecaller"
uptodown-dlurl = "https://truecaller.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/true-software-scandinavia-ab/truecaller-caller-id-block"
patches-source = "Paresh-Maheshwari/paresh-patches"
patches-source-host = "gitlab"



[ProtonVPN-Morphe-Rushiranpise-Experimental]
enabled = true
app-name = "Proton VPN"
engine-brand = "Morphe"
patch-brand = "Rushiranpise"
sub-variant = "Experimental"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/ch.protonvpn.android"
version = "latest"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
pkg-name = "ch.protonvpn.android"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://protonvpn.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/proton-technologies-ag/protonvpn-secure-and-free-vpn/"
prefer-dl-mode = "bundle"
dpi = "120-640dpi"
patches-source = "rushiranpise/morphe-patches"



[OxygenUpdater-Morphe-Rushiranpise]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Oxygen Updater"
engine-brand = "Morphe"
patch-brand = "Rushiranpise"
custom-microg-patches = "'None'"
build-mode = "apk"
pkg-name = "com.arjanvlek.oxygenupdater"
github-dlurl = "https://github.com/oxygen-updater/os-updater"
patches-source = "rushiranpise/morphe-patches"


[JetpackJoyride-Morphe-Byehi98]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Jetpack Joyride"
engine-brand = "Morphe"
patch-brand = "Byehi98"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.halfbrick.jetpackjoyride"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
pkg-name = "com.halfbrick.jetpackjoyride"
uptodown-dlurl = "https://jetpack-joyride.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/halfbrick-studios/jetpack-joyride/"
apkmirror-example-url = "https://www.apkmirror.com/apk/halfbrick-studios/jetpack-joyride/jetpack-joyride-1-104-1-release/"
patches-source = "byehi98/okish-morphe-patches"


[Drofus-Morphe-Lain]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "Drofus"
engine-brand = "Morphe"
patch-brand = "Lain"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.mixapplications.rufus"
build-mode = "apk"
arch = "arm64-v8a arm-v7a"
pkg-name = "com.mixapplications.rufus"
uptodown-dlurl = "https://rufus-unofficial.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/mixapplications/drofus-iso2usb"
patches-source = "kiraio-moe/Lain-Patches"


[BraveBrowser-Morphe-Kveld9]
enabled = true
app-name = "Brave Browser"
engine-brand = "Morphe"
patch-brand = "Kveld9"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
pkg-name = "com.brave.browser"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "kveld9/kveld-morphe-patches"
patcher-args = "--continue-on-error"
github-dlurl = "https://github.com/brave/brave-browser/releases"
github-dlurl-regex = "arm64-v8a: (BraveMonoarm64|MonoArm64)\\.apk$ | arm-v7a: (BraveMonoarm|MonoArm)\\.apk$ | x86_64: (BraveMonox64|BraveMonoX64|Monox64|MonoX64|[xX]64)\\.apk$"
github-release-name-regex = "^Release v"



[AmazonAlexa-APKSigner-Signed]
enabled = true
app-name = "Amazon Alexa"
engine-brand = "APKSigner"
patch-brand = "Signed"
build-mode = "apk"
cli-source = "apksigner"
pkg-name = "com.amazon.dee.app"
cli-source-host = "none"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.amazon.dee.app"
patches-source = "none"
patches-source-host = "none"
arch = "all arm64-v8a arm-v7a x86_64"
prefer-dl-mode = "bundle"
uptodown-dlurl = "https://alexa.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/amazon-mobile-llc/amazon-alexa/"
dpi = "120-480dpi 480-640dpi"

