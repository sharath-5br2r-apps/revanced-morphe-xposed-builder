# ── Eyecon (morphe-paresh) ────────────────────────────────────────────────────


[bitwarden-morphe-stylus-exp]
enabled = true
app-name = "bitwarden"
rv-brand = "morphe-stylus-exp"
build-mode = "apk"
pkg-name = "com.x8bit.bitwarden"
cli-source = "MorpheApp/morphe-desktop"
github-dlurl = "https://github.com/bitwarden/android"
github-dlurl-regex = "fdroid.apk$"
github-release-regex = "bwpm"
version = "latest"
patches-source = "ch3thanhs/stylus"


[adobe-acrobat-morphe-hooman-exp]
