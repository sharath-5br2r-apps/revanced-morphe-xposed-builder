# --- Batch TOML Part 14 (8 distinct apps, 8 builds) ---


[xodo-morphe-hoodles]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "xodo"
rv-brand = "morphe-hoodles"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.xodo.pdf.reader"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
pkg-name = "com.xodo.pdf.reader"
uptodown-dlurl = "https://xodo-pdf-reader-editor.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/xodo-technologies-inc/xodo-pdf-reader-editor"
patches-source = "hoo-dles/morphe-patches"



[tiktok-morphe-hxreborn]
enabled = true
app-name = "tiktok"
pkg-name = "com.zhiliaoapp.musically"
rv-brand = "morphe-hxreborn"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a"
uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tiktok-pte-ltd/tik-tok-including-musical-ly"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.zhiliaoapp.musically"
patches-source = "hxreborn/hxreborn-tiktok-patches"


[proton-vpn-morphe-rushiranpise]
enabled = true
app-name = "proton-vpn"
rv-brand = "morphe-rushiranpise"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/ch.protonvpn.android"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
pkg-name = "ch.protonvpn.android"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://protonvpn.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/proton-technologies-ag/protonvpn-secure-and-free-vpn/"
prefer-dl-mode = "bundle"
dpi = "120-640dpi"
patches-source = "rushiranpise/morphe-patches"



[nova-launcher-morphe-hoodles-exp]
enabled = true
cli-source = "MorpheApp/morphe-desktop"
app-name = "nova-launcher"
rv-brand = "morphe-hoodles-exp"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.teslacoilsw.launcher"
version = "latest"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a"
pkg-name = "com.teslacoilsw.launcher"
uptodown-dlurl = "https://nova-launcher.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instabridge-sweden-ab/nova-launcher"
patches-source = "hoo-dles/morphe-patches"



[instagram-morphe-piko]
enabled = true
app-name = "instagram"
rv-brand = "morphe-piko"
build-mode = "apk"
arch = "arm64-v8a x86_64"
pkg-name = "com.instagram.android"
patcher-args = "--continue-on-error"
cli-source = "MorpheApp/morphe-desktop"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
apkmirror-example-url = "https://www.apkmirror.com/apk/instagram/instagram-instagram/instagram-439-0-0-37-89-release/"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.instagram.android"
patches-source = "crimera/piko"


# ── X (Twitter) morphe-piko (no material you) ─────────────────────────────────



[doc-scanner-morphe-paresh-exp]
