# ── Bluetooth Keyboard and Mouse (morphe-rushiranpise) ───────────────────────


[Gboard-Morphe-Jasonwu1994Adobo-Clone]
enabled = true
app-name = "Gboard"
engine-brand = "Morphe"
patch-brand = "Jasonwu1994Adobo"
sub-variant = "Clone"
build-mode = "apk"
arch = "arm64-v8a arm-v7a x86_64"
patches-source = "'jasonwu1994/Gboard-patches' 'jkennethcarino/adobo'"
included-patches = " | 'Enable clipboard in incognito' 'Enable voice typing in incognito'"
exclusive-patches = "jkennethcarino/adobo"
excluded-patches = "'Package Rename' | "
pkg-name = "com.google.android.inputmethod.latin"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.google.android.inputmethod.latin"
cli-source = "MorpheApp/morphe-desktop"
patcher-args = "-f --continue-on-error"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/gboard"
apkmirror-example-url = "https://www.apkmirror.com/apk/google-inc/gboard/gboard-the-google-keyboard-17-8-7-939743344-release/"
apkmirror-release-filter = "!(lite|beta)"


