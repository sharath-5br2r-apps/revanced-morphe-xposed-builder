# --- Batch TOML Part 6/10 (13 apps) ---


[youtube-morphe-exp]
enabled = true
app-name = "youtube"
rv-brand = "morphe-exp"
build-mode = "both"
arch = "all arm64-v8a arm-v7a x86_64"
version = "exp"
pkg-name = "com.google.android.youtube"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "MorpheApp/morphe-patches"
included-patches = "'Theme'"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
apkpure-dlurl = "https://apkpure.com/youtube-app/com.google.android.youtube"
apkcombo-dlurl = "https://apkcombo.com/youtube/com.google.android.youtube"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.google.android.youtube"
dpi = "nodpi anydpi auto"

# ── YouTube morphe-exp-mocha (exp APK + Catppuccin Mocha) ─────────────────────


[youtube-morphe-exp-mocha]
enabled = true
app-name = "youtube"
rv-brand = "morphe-exp-mocha"
build-mode = "both"
arch = "all arm64-v8a arm-v7a x86_64"
version = "exp"
pkg-name = "com.google.android.youtube"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "MorpheApp/morphe-patches"
included-patches = "'Theme'"
patcher-args = "-OdarkThemeBackgroundColor=#FF181825 -OlightThemeBackgroundColor=#E6E9EF"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://apkmirror.com/apk/google-inc/youtube"
apkpure-dlurl = "https://apkpure.com/youtube-app/com.google.android.youtube"
apkcombo-dlurl = "https://apkcombo.com/youtube/com.google.android.youtube"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.google.android.youtube"
dpi = "nodpi anydpi auto"

