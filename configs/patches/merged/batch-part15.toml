# --- Batch TOML Part 15 (8 distinct apps, 8 builds) ---


[x-morphe-piko-materialyou-exp]
enabled = true
app-name = "x"
brand = "piko"
variant = "materialyou"
sub-variant = "exp"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
version = "latest"
pkg-name = "com.twitter.android"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "crimera/piko"
patches-source-host = "github"
included-patches = "'Dynamic Color'"
patcher-args = "--continue-on-error"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
cache_repo_dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.twitter.android"


[symfonium-morphe-hooman]
enabled = true
app-name = "symfonium"
brand = "hooman"
build-mode = "apk"
arch = "all arm64-v8a arm-v7a x86_64"
pkg-name = "app.symfonik.music.player"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://symfonium.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/tolriq/symfonium-music-player-cast"
