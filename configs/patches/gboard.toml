enable-module-update = true
patches-source = "'jasonwu1994/Gboard-patches' 'jkennethcarino/adobo'"
patch-brand = "Jasonwu1994-Adobo"
cli-type = "morphe"

[Gboard-Morphe-Jasonwu1994-Adobo]
enabled = true
app-name = "Gboard"
build-mode = "both"
arch = "arm64-v8a x86_64 armeabi-v7a x86"
pkg-name = "com.google.android.inputmethod.latin"
skip-patch-app-check = true
