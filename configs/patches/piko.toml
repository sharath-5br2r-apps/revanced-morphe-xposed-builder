enable-module-update = true
patches-version = "absolutelatest"

[instagram-morphe-piko]
enabled = true
app-name = "instagram"
rv-brand = "morphe-piko"
build-mode = "apk"
arch = "both64"
pkg-name = "com.instagram.android"
patcher-args = "--continue-on-error"
cli-source = "MorpheApp/morphe-desktop"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
#archive-dlurl = "https://archive.org/download/geologically/apks/com.instagram.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
dpi = "nodpi anydpi auto"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.instagram.android"
patches-source = "crimera/piko"


# ── X (Twitter) morphe-piko (no material you) ─────────────────────────────────
[x-morphe-piko]
enabled = true
app-name = "x"
rv-brand = "morphe-piko"
build-mode = "apk"
arch = "all"
version = "latest"
pkg-name = "com.twitter.android"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "crimera/piko"
patches-source-host = "github"
excluded-patches = "'Dynamic Color'"
patcher-args = "--continue-on-error"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.twitter.android"
dpi = "nodpi anydpi auto"

# ── X (Twitter) morphe-piko-materialu (Material You / Dynamic Color) ──────────
[x-morphe-piko-materialu]
enabled = true
app-name = "x"
rv-brand = "morphe-piko-materialu"
build-mode = "apk"
arch = "all"
version = "latest"
pkg-name = "com.twitter.android"
cli-source = "MorpheApp/morphe-desktop"
patches-source = "crimera/piko"
patches-source-host = "github"
included-patches = "'Dynamic Color'"
patcher-args = "--continue-on-error"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
github-dlurl = "https://github.com/sharath-5br2r-apps/apks-dump/releases/tag/com.twitter.android"
dpi = "nodpi anydpi auto"
