# ── YouTube morphe-anddea (stock/AMOLED, default) ─────────────────────────────
[youtube-morphe-anddea]
enabled = true
app-name = "youtube"
rv-brand = "morphe-anddea"
build-mode = "both"
arch = "all arm64-v8a arm-v7a x86_64"
